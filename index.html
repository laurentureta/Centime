<style>
:root{
  --bg:#0a0a0c;--bg2:#121215;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
  --tx:#f5f5f7;--tx2:#a1a1a6;--tx3:#6e6e73;
  --gold:#e6bd6a;--gold2:#b8862f;--goldbg:rgba(230,189,106,.13);--goldtx:#1a1306;
  --green:#32d74b;--blue:#64d2ff;--purple:#bf5af2;--red:#ff453a;--orange:#ff9f0a;
  --glass:rgba(18,18,21,.72);--shadow:0 10px 30px rgba(0,0,0,.35);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#f2f2f7;--bg2:#ffffff;--card:#ffffff;--card2:#f0f0f4;--line:rgba(0,0,0,.08);
  --tx:#1c1c1e;--tx2:#5f5f64;--tx3:#8e8e93;
  --gold:#a8771f;--gold2:#8a5f12;--goldbg:rgba(168,119,31,.11);--goldtx:#fff;
  --green:#1f9d3a;--blue:#0a84ff;--purple:#8e44ad;--red:#d70015;--orange:#c96a00;
  --glass:rgba(249,249,251,.8);--shadow:0 6px 20px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 85% -10%,rgba(230,189,106,.16),transparent 60%),radial-gradient(80% 50% at 0% 0%,rgba(100,210,255,.06),transparent 60%)}
[data-theme=light] body::before{background:radial-gradient(120% 70% at 85% -10%,rgba(168,119,31,.10),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#view{position:relative;z-index:1;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 104px);max-width:640px;margin:0 auto}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* en-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 16px}
.top small{display:block;color:var(--tx2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.top h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.top .act{display:flex;gap:8px}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.icbtn svg{width:19px;height:19px}
.icbtn.ok{color:var(--green)}.icbtn.err{color:var(--red)}.icbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h3{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .r{text-transform:none;letter-spacing:0;font-weight:600;color:var(--tx3)}
.hero{position:relative;overflow:hidden;padding:20px 18px 18px;background:linear-gradient(160deg,rgba(230,189,106,.22),rgba(230,189,106,.04) 55%,rgba(255,255,255,.03));border-color:rgba(230,189,106,.25)}
[data-theme=light] .hero{background:linear-gradient(160deg,rgba(168,119,31,.16),#fff 60%)}
.hero .lbl{font-size:13px;color:var(--tx2);font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 10px}
.hero .big span{font-size:24px;font-weight:700;color:var(--tx2);margin-left:4px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--tx2)}
.hero .sub b{color:var(--tx);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--goldbg);color:var(--gold)}
.badge.g{background:rgba(50,215,75,.14);color:var(--green)}.badge.o{background:rgba(255,159,10,.15);color:var(--orange)}
.badge.b{background:rgba(100,210,255,.14);color:var(--blue)}.badge.p{background:rgba(191,90,242,.15);color:var(--purple)}.badge.r{background:rgba(255,69,58,.14);color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.grid2 button.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;font:inherit;color:inherit}
.stat .k{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.stat .v small{font-size:14px;font-weight:700;color:var(--tx2)}
.stat .d{font-size:13px;color:var(--tx2);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--gold)}
/* lignes */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0;padding-top:2px}
.row .l{color:var(--tx2);flex:1;min-width:0}.row .l b{color:var(--tx);font-weight:600}
.row .v{font-weight:700;text-align:right;white-space:nowrap;flex:0 0 auto}
.row.tot .l{color:var(--tx);font-weight:800}.row.tot .v{font-size:17px}
.muted{color:var(--tx2)}.tiny{font-size:12px;color:var(--tx3)}

  background:linear-gradient(90deg,#b8862f 0%,#f6d68c 25%,#fff6dc 50%,#f6d68c 75%,#b8862f 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;

<script>
/* ============================================================
   CENTIME — moteur de calcul (heures, paie, congés)
   Calé sur le bulletin Cerdagne Meubles de septembre 2026.
   ============================================================ */
const Engine = (() => {
  /* ---------- arrondi au centime (demi supérieur, robuste aux flottants) ---------- */
  const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-6) / 100; };
  const r4 = x => { const s = x < 0 ? -1 : 1; return s * Math.floor(Math.abs(x) * 10000 + 0.5 + 1e-6) / 10000; };

  /* ---------- dates (clés 'AAAA-MM-JJ', calcul en UTC) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const toKey = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (k, n) => { const d = fromKey(k); d.setUTCDate(d.getUTCDate() + n); return toKey(d); };
  const dow = k => fromKey(k).getUTCDay(); // 0 = dimanche
  const ymOf = k => k.slice(0, 7);
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); };
  const mondayOf = k => addDays(k, -((dow(k) + 6) % 7));
  const dayDiff = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
  const isoWeek = k => {
    const d = fromKey(k); const n = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - n);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - y0) / 864e5 + 1) / 7);
  };
  const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  /* ---------- jours fériés français ---------- */
  const easter = y => {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return toKey(new Date(Date.UTC(y, mo - 1, da)));
  };
  const holCache = {};
  const holidays = y => {
    if (holCache[y]) return holCache[y];
    const e = easter(y), h = {};
    h[y + '-01-01'] = "Jour de l'an"; h[addDays(e, 1)] = 'Lundi de Pâques'; h[y + '-05-01'] = 'Fête du Travail';
    h[y + '-05-08'] = 'Victoire 1945'; h[addDays(e, 39)] = 'Ascension'; h[addDays(e, 50)] = 'Lundi de Pentecôte';
    h[y + '-07-14'] = 'Fête nationale'; h[y + '-08-15'] = 'Assomption'; h[y + '-11-01'] = 'Toussaint';
    h[y + '-11-11'] = 'Armistice'; h[y + '-12-25'] = 'Noël';
    return (holCache[y] = h);
  };
  const holidayName = k => holidays(+k.slice(0, 4))[k] || null;

  /* ---------- heures ---------- */
  const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  // une plage qui finit avant de commencer n'est acceptée que si elle passe vraiment la nuit (début ≥ 17 h, fin ≤ 9 h)
const segMin = s => { const a = toMin(s[0]), b = toMin(s[1]); if (a == null || b == null || isNaN(a) || isNaN(b)) return 0; if (b > a) return b - a; if (b < a && a >= 17 * 60 && b <= 9 * 60) return b + 1440 - a; return 0; };
const segValid = s => !s[0] || !s[1] || segMin(s) > 0;
  const sumSeg = segs => (segs || []).reduce((t, s) => t + segMin(s), 0);
  const ticketEligible = segs => {
    let am = false, pm = false;
    (segs || []).forEach(s => {
      const a = toMin(s[0]), b = toMin(s[1]); if (a == null || b == null || segMin(s) === 0) return;
      if (a < 13 * 60) am = true;
      if ((b >= a ? b : b + 1440) > 14 * 60) pm = true;
    });
    return am && pm;
  };

  /* ---------- réglages par défaut (contrat + bulletin) ---------- */
  const W = [['09:30', '12:30'], ['15:00', '19:00']];
  const defaults = () => ({
    prenom: '',
    nom: '',
    poste: 'Livreur / magasinier',
    employeur: 'Cosy Maison',
    societe: 'Cerdagne Meubles SAS',
    adresseEmployeur: '2 rue des Isards, 66800 Saillagouse',
    destinataire: 'La Direction',
    ville: 'Saillagouse',
    contrat: { debut: '2026-10-01', fin: '2027-03-27', type: 'CDD' },
    tauxHoraire: 12.61,
    heuresMensuelles: 151.67,
    planning: [[], [], W, W, W, W, W], // dim, lun, mar … sam
    hs: { seuil25: 35, seuil50: 43, maj25: 25, maj50: 50, reposEnHS: true },
    majDimanche: 0, majFerie: 0, maj1erMai: 100,
    tickets: { actif: true, valeur: 7, partEmployeur: 60 },
    cotis: { vieillessePlaf: 6.90, vieillesseDeplaf: 0.40, t1: 4.01, t2: 9.72, cet: 0.14, csgDed: 6.80, csgNd: 2.40, crds: 0.50, abattement: 98.25, reducHS: 11.31 },
    pass: 4005,
    prevoyancePatronale: 83.20,
    mutuelleSalarie: 0,
    pas: 0,
    clotureJour: 26,
    deduireManquantes: false,
    cp: { mode: 'ouvrables', report: 7 },
    brutSaisonnier: 5476.33,
    saisonDebut: '2026-07-10',
    paie: { jour: 0 },
    revolut: { libelle: 'CERDAGNE, COSY' },
    bank: { mode: 'direct', appId: '', privateKey: '', relayUrl: '', relayToken: '', aspsp: 'Revolut', country: 'FR', session: '', account: '', accountName: '', validUntil: '', lastSync: 0, lastErr: '', pendingState: '' },
    look: { accent: 'or', oled: false },
    fx: { sons: true, confettis: true },
    meteo: { actif: true, ville: 'Saillagouse' },
    epargne: { actif: false, nom: '', objectif: 500, part: 50, deja: 0 },
    lock: { mode: 'off', pinHash: '', salt: '', cred: '', want: '' },
    finContrat: { precarite: true, inclureCP: true },
    theme: 'dark',
    schema: 2,
    github: { owner: '', repo: '', branch: 'main', path: 'centime-data.json', token: '', auto: false, last: null },
  });
  const newState = () => ({ v: 1, settings: defaults(), days: {}, months: {}, requests: [], badges: {}, fx: {}, clock: null });

  /* ---------- journée ---------- */
  function dayInfo(S, k) {
    const st = S.settings;
    const inC = k >= st.contrat.debut && k <= st.contrat.fin;
    const hol = holidayName(k);
    const plan = inC ? (st.planning[dow(k)] || []) : [];
    const planMin = sumSeg(plan);
    const e = S.days[k];
    let type, segs = [], confirmed = false;
    if (e) { type = e.type; segs = type === 'travail' ? (e.seg || []) : []; confirmed = true; }
    else if (!inC) type = 'hors';
    else if (hol && planMin > 0) type = 'ferie';
    else if (planMin > 0) { type = 'travail'; segs = plan; }
    else type = 'repos';
    if (hol && planMin > 0 && type === 'repos') type = 'ferie';
    const worked = type === 'travail' ? sumSeg(segs) : 0;
    // evt = absence autorisée payée (événement familial…) ; recupMin / absMin = quelques heures d'absence dans une journée travaillée
    let paidAbs = (type === 'cp' || type === 'recup' || type === 'evt' || type === 'ferie' || (hol && (type === 'maladie' || type === 'absence'))) ? planMin : 0;
    let unpaid = (type === 'maladie' || type === 'absence') && !hol ? planMin : 0;
    if (type === 'travail' && e) { paidAbs += +e.recupMin || 0; unpaid += +e.absMin || 0; }
    let ticket = false;
    if (st.tickets.actif && type === 'travail') {
      const o = e && e.ticket;
      ticket = o === 'oui' ? true : o === 'non' ? false : ticketEligible(segs);
    }
    return { k, inC, hol, plan, planMin, type, segs, worked, paidAbs, unpaid, ticket, confirmed, note: e && e.note || '' };
  }

  /* ---------- rattachement au mois de paie ---------- */
  function payMonth(S, k) {
    const st = S.settings, c = +st.clotureJour || 0;
    let ym = c && +k.slice(8) > c ? addMonths(ymOf(k), 1) : ymOf(k);
    const a = ymOf(st.contrat.debut), b = ymOf(st.contrat.fin);
    if (ym < a) ym = a; if (ym > b) ym = b;
    return ym;
  }

  /* ---------- bulletin à partir des éléments variables ---------- */
  function payslip(st, I) {
    const c = st.cotis, L = [];
    const taux = st.tauxHoraire;
    const t25 = r4(taux * (1 + st.hs.maj25 / 100)), t50 = r4(taux * (1 + st.hs.maj50 / 100));
    const m25 = r2(I.h25 * t25), m50 = r2(I.h50 * t50), mNM = r2(I.hNM * taux);
    const mSun = r2(I.hSun * taux * st.majDimanche / 100), mFer = r2(I.hFer * taux * st.majFerie / 100), mMai = r2(I.hMai * taux * st.maj1erMai / 100);
    const primes = r2((I.primes || []).reduce((t, p) => t + (+p.montant || 0), 0));
    const extras = r2((I.extras || []).reduce((t, p) => t + (+p.montant || 0), 0));
    const brut = r2(I.base - I.absDed - I.defDed + m25 + m50 + mNM + mSun + mFer + mMai + primes + extras);
    const hsExo = r2(m25 + m50);
    const pass = st.pass, plaf = Math.min(brut, pass);
    const vPlaf = r2(plaf * c.vieillessePlaf / 100), vDeplaf = r2(brut * c.vieillesseDeplaf / 100), t1 = r2(plaf * c.t1 / 100);
    const t2 = brut > pass ? r2((Math.min(brut, 8 * pass) - pass) * c.t2 / 100) : 0;
    const cet = brut > pass ? r2(Math.min(brut, 8 * pass) * c.cet / 100) : 0;
    const mut = r2(+st.mutuelleSalarie || 0);
    const reducRate = Math.min(c.reducHS, c.vieillessePlaf + c.vieillesseDeplaf + c.t1);
    const reduc = r2(hsExo * reducRate / 100);
    const baseCSG = r2(r2((brut - hsExo) * c.abattement / 100) + (+st.prevoyancePatronale || 0));
    const baseCSGhs = r2(hsExo * c.abattement / 100);
    const csgDed = r2(baseCSG * c.csgDed / 100);
    const csgNd = r2(r2(baseCSG * c.csgNd / 100) + r2(baseCSG * c.crds / 100));
    const csgHsDed = r2(baseCSGhs * c.csgDed / 100);
    const csgHs = r2(csgHsDed + r2(baseCSGhs * c.csgNd / 100) + r2(baseCSGhs * c.crds / 100));
    const retenues = r2(vPlaf + vDeplaf + t1 + t2 + cet + mut - reduc + csgDed);
    const netSocial = r2(brut - retenues - csgNd - csgHs);
    const ticketSal = r2(st.tickets.valeur * (1 - st.tickets.partEmployeur / 100));
    const ticketPat = r2(st.tickets.valeur * st.tickets.partEmployeur / 100);
    const tickets = r2(I.tickets * ticketSal);
    const netAvantIR = r2(netSocial - tickets);
    const hsNetExo = r2(hsExo - csgHsDed);
    const imposable = r2(brut - retenues - csgHsDed - hsNetExo);
    const pas = r2(imposable * st.pas / 100);

const nf = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------- état ---------- */
function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def;
  if (def && typeof def === 'object') {
    const o = {};
    for (const k in def) o[k] = val && typeof val === 'object' && k in val ? merge(def[k], val[k]) : def[k];
    if (val && typeof val === 'object') for (const k in val) if (!(k in o)) o[k] = val[k];
    return o;
  }
  return val === undefined || val === null ? def : val;
}
function hydrate(j) {
  const s = E.newState();
  const old = j.settings || {};
  s.settings = merge(s.settings, old);
  // v1.3 : clôture de paie au 26 (déduite du bulletin de septembre) pour les données créées avant
  if (!old.schema) { if (!old.clotureJour) s.settings.clotureJour = 26; s.settings.schema = 2; }
  s.days = j.days || {}; s.months = j.months || {}; s.requests = Array.isArray(j.requests) ? j.requests : []; s.badges = j.badges || {}; s.fx = j.fx || {}; s.clock = j.clock || null; s.onboarded = !!j.onboarded;
  return s;
}
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.v) return hydrate(j); } catch (e) { }
  return E.newState();
}
let S = load();

const contractYm = ym => { const a = E.ymOf(S.settings.contrat.debut), b = E.ymOf(S.settings.contrat.fin); return ym < a ? a : ym > b ? b : ym; };

let rendering = false, renderAgain = false;

}

function ring(eff, target) {

/* ---------- HEURES ---------- */
function vHours() {

  return h;
}

/* ---------- PAIE ---------- */
function vPay() {
  const yms = Object.keys(R.months);
  const ym = ui.payYm && R.months[ui.payYm] ? ui.payYm : contractYm(E.ymOf(today()));
  const M = R.months[ym], isFinal = ym === R.fin.ymFin && R.fin.final && (R.fin.iccp || R.fin.precarite);
  const P = isFinal && ui.showFinal ? R.fin.final : M.pay;
  let h = head('Bulletin reconstitué', 'Paie');
  h += '<div class="chips">' + yms.map(y => `<button class="chip ${y === ym ? 'on' : ''}" data-a="payYm" data-ym="${y}">${ymShort(y)}</button>`).join('') + '</div>';
  let status;
  if (M.unconfirmed) status = `<span class="badge o">Estimation · ${M.unconfirmed} j passés non confirmés</span>`;
  else if (M.futurePlanned) status = `<span class="badge">Prévisionnel · ${M.futurePlanned} j à venir</span>`;
  else status = `<span class="badge g">✓ Mois entièrement saisi</span>`;
  h += `<div class="card hero"><div class="lbl">Net à payer · ${ymLabel(ym)}${isFinal && ui.showFinal ? ' · solde de tout compte' : ''}</div>
    <div class="big num" data-count="${P.net}">${n2(P.net)}<span>€</span></div>
    <div class="sub"><span>Brut <b class="num">${eur(P.brut)}</b></span><span>Net social <b class="num">${eur(P.netSocial)}</b></span><span>Imposable <b class="num">${eur(P.imposable)}</b></span></div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${status}</div></div>`;
  if (isFinal) h += `<div class="card"><div class="fld" style="padding:0"><label>Inclure le solde de tout compte<small>Congés non pris + indemnité de fin de contrat (estimation)</small></label><label class="sw"><input type="checkbox" id="showFinal" ${ui.showFinal ? 'checked' : ''}><span></span></label></div></div>`;

  // répartition
  const cot = r2(P.retenues - P.csgDed), csg = r2(P.csgDed + P.csgNd + P.csgHs);
  const parts = [[P.net, 'var(--gold)', 'Net'], [cot, 'var(--blue)', 'Retraite'], [csg, 'var(--purple)', 'CSG/CRDS'], [P.tickets, 'var(--orange)', 'Tickets'], [P.pas, 'var(--red)', 'Impôt']].filter(p => p[0] > 0);
  h += `<div class="card"><h3>Où va ton brut</h3><div style="display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px">${parts.map(p => `<i style="flex:${p[0]};background:${p[1]}"></i>`).join('')}</div>
    <div class="legend">${parts.map(p => `<span><i style="background:${p[1]}"></i>${p[2]} ${eur(p[0])} · ${Math.round(p[0] / P.brut * 100)} %</span>`).join('')}</div></div>`;

  h += `<div class="card bul"><h3>Bulletin<span class="r">${ymLabel(ym)}</span></h3>${bulletin(P)}</div>`;
  h += `<div class="card"><h3>Infos du bulletin</h3><div class="rows">
    <div class="row"><span class="l">Net imposable</span><span class="v num">${eur(P.imposable)}</span></div>
    <div class="row"><span class="l">Heures sup nettes exonérées d'impôt</span><span class="v num">${eur(P.hsNetExo)}</span></div>
    <div class="row"><span class="l">Tickets resto · part employeur</span><span class="v num pos">+${eur(P.ticketsPat)}</span></div>
    <div class="row"><span class="l">dont suppression cotis. chômage et maladie</span><span class="v num">${eur(P.evolution)}</span></div>
    <div class="row"><span class="l">Heures sup du mois</span><span class="v num">${hm(M.min25 + M.min50)}</span></div></div>
    ${P.m25 + P.m50 ? `<div class="eqs" style="margin-top:10px">${equivHtml((P.m25 + P.m50) * (P.brut ? P.netAvantIR / P.brut : 0.78))}</div>` : ''}</div>`;

  // primes
  const mo = S.months[ym] || {};
  const primes = mo.primes || [];
  h += `<div class="card"><h3>Primes du mois</h3><div class="rows">${primes.map((p, i) => `<div class="row"><span class="l"><b>${esc(p.label || 'Prime')}</b></span><span class="v num">${eur(+p.montant || 0)} <button class="btn sm ghost dang" data-a="delPrime" data-ym="${ym}" data-i="${i}" aria-label="Supprimer">${IC.x}</button></span></div>`).join('') || '<div class="empty">Aucune prime ce mois-ci</div>'}</div>
    <div style="display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px"><input class="inp" id="pLabel" placeholder="Libellé (ex. Prime A)"><input class="inp num" id="pAmount" inputmode="decimal" placeholder="Montant"><button class="btn sm pri" data-a="addPrime" data-ym="${ym}">${IC.plus}</button></div>
    <p class="tiny" style="margin-top:8px">Montant brut, soumis à cotisations comme sur ton bulletin.</p></div>`;

  h += reelCard(ym, M.pay, M);
  h += `<button class="card bilan" data-a="sim"><div><h3 style="margin-bottom:4px">🔮 Et si… ?</h3><div class="tiny">Un lundi de plus, des heures sup, une absence : vois ton net changer</div></div><span class="go">Simuler ›</span></button>`;

  // contrôle
  const T = E.selfTest(S.settings);
  h += `<div class="card"><div class="ver ${T.ok ? '' : 'ko'}"><div class="ic">${T.ok ? '✓' : '!'}</div><div><b>${T.ok ? 'Moteur contrôlé sur ton bulletin de septembre 2026' : 'Écart avec le bulletin de référence'}</b><div class="tiny">${T.checks.filter(c => c.ok).length}/${T.checks.length} montants identiques au centime</div></div></div>
    <details><summary>Voir le détail</summary><div class="chk"><b>Ligne</b><b>Bulletin</b><b>Centime</b>${T.checks.map(c => `<span>${labelCheck(c.key)}</span><span>${n2(c.attendu)}</span><span class="${c.ok ? 'pos' : 'neg'}">${n2(c.calcule)}</span>`).join('')}</div></details></div>`;

  // cumuls
  const cur = contractYm(E.ymOf(today()));
  const past = Object.values(R.months).filter(m => m.ym <= cur);
  const sum = f => r2(past.reduce((a, m) => a + f(m), 0));
  h += `<div class="card"><h3>Cumuls du contrat<span class="r">jusqu'à ${ymMonth(cur)}</span></h3><div class="rows">
    <div class="row"><span class="l">Brut cumulé</span><span class="v num">${eur(sum(m => m.pay.brut))}</span></div>
    <div class="row"><span class="l">Net cumulé</span><span class="v num">${eur(sum(m => m.pay.net))}</span></div>
    <div class="row"><span class="l">Heures sup</span><span class="v num">${hm(past.reduce((a, m) => a + m.min25 + m.min50, 0))} · ${eur(sum(m => m.pay.m25 + m.pay.m50))}</span></div>
    <div class="row"><span class="l">Brut total prévu sur le contrat</span><span class="v num">${eur(R.fin.brutContrat)}</span></div></div></div>`;
  return h;
}
function labelCheck(k) {
  return ({ brut: 'Salaire brut', retenues: 'Total retenues', netSocial: 'Net social', netAvantIR: 'Net avant impôt', imposable: 'Net imposable', hsNetExo: 'HS nettes exo.', csgNd: 'CSG/CRDS non déd.', csgHs: 'CSG/CRDS HS', csgDed: 'CSG déductible', tickets: 'Tickets resto', evolution: 'Suppr. cotis.', net: 'Net à payer' })[k] || k;
}
const r2 = E.r2;
function bulletin(P) {
  const G = { rem: 'Rémunération', cot: 'Cotisations salariales', csg: 'CSG / CRDS', net: 'Net' };
  let h = '', g = '';
  P.lines.forEach(l => {
    if (l.g !== g) { g = l.g; h += `<div class="grp">${G[g]}</div>`; }
    let d = '';
    if (l.cls === 'total' || l.cls === 'sub' || l.cls === 'grand') d = '';
    else if (l.g === 'rem' && l.base != null && l.taux != null) d = `${n2(l.base)} h × ${nf4.format(l.taux)} €`;
    else if (l.g === 'rem' && l.base != null) d = `${n2(l.base)} h`;
    else if (l.label.startsWith('Tickets')) d = `${l.base} × ${n2(l.taux)} €`;
    else if (l.base != null && l.taux != null) d = `${n2(l.base)} € × ${nf4.format(Math.abs(l.taux))} %`;
    const m = l.montant;
    h += `<div class="bl ${l.cls || ''}"><div><div class="bn">${esc(l.label)}</div>${d ? `<div class="bd num">${d}</div>` : ''}</div><div class="bm num">${l.cls === 'total' || l.cls === 'sub' || l.cls === 'grand' ? eur(Math.abs(m)) : (m < 0 ? '−' : '') + eur(Math.abs(m))}</div></div>`;
  });
  return h;
}

/* ---------- CONGÉS ---------- */
function vCP() {
  const C = R.cp, F = R.fin, st = S.settings, t = today();
  let h = head('Congés payés', 'Congés');
  const totalVu = C.report + C.acquis;
  h += `<div class="card hero"><div class="lbl">Solde disponible aujourd'hui</div>
    <div class="big num">${nd(C.solde)}<span>jours</span></div>
    <div class="bar" style="margin:4px 0 10px"><i style="width:${totalVu ? Math.max(0, Math.min(100, C.solde / totalVu * 100)) : 0}%"></i></div>
    <div class="sub"><span>Jours <b>${C.unite}</b></span><span>Au ${dShort(st.contrat.fin)} : <b>${C.soldeFin} j</b> si rien d'autre n'est posé</span></div></div>`;
  h += `<div class="card"><div class="rows">
    <div class="row"><span class="l">Reportés du contrat saisonnier</span><span class="v num">${nd(C.report)} j</span></div>
    <div class="row"><span class="l">Acquis depuis le ${dDate(st.contrat.debut)}</span><span class="v num">+${nd(C.acquis)} j</span></div>
    <div class="row"><span class="l">Déjà pris</span><span class="v num">${C.prisPasses ? '−' : ''}${C.prisPasses} j</span></div>
    <div class="row"><span class="l">Posés à venir</span><span class="v num">${C.posesFuturs ? '−' : ''}${C.posesFuturs} j</span></div>
    <div class="row tot"><span class="l">Solde</span><span class="v num gold">${nd(C.solde)} j</span></div></div>
    <p class="tiny" style="margin-top:8px">+${st.cp.mode === 'ouvres' ? '2,08' : '2,5'} jours par mois. Total en fin de contrat : ${nd(C.acquisFin)} j, arrondis à ${C.acquisFinArrondi} j (arrondi légal au jour supérieur).</p></div>`;

  h += `<div class="card"><h3>Mes demandes<span class="r">lettre PDF</span></h3>
    <div class="rows">${S.requests.slice().reverse().map(q => { const stt = REQ_STATUS[q.status] || REQ_STATUS.brouillon; return `<button class="row reqrow" data-a="rOpen" data-id="${q.id}"><span class="l"><b>${REQ_TYPES[q.type]}</b><br><span class="tiny">${reqPeriod(q)}${q.applied ? ' · dans le calendrier' : ''}</span></span><span class="v"><span class="badge ${stt[1]}">${stt[0]}</span></span></button>`; }).join('') || '<div class="empty">Congés, récup, échange de jour, absence : remplis les dates, Centime calcule le reste et prépare la lettre.</div>'}</div>
    <div class="btns" style="margin-top:10px"><button class="btn pri" data-a="rNew">${IC.doc} Nouvelle demande</button></div></div>`;
  h += `<div class="card"><h3>Poser des congés directement</h3>
    <div class="fld" style="padding-top:0"><label>Du</label><input type="date" id="cpFrom" value="${t}"></div>
    <div class="fld"><label>Au (inclus)</label><input type="date" id="cpTo" value="${t}"></div>
    <div class="btns" style="margin-top:8px"><button class="btn pri" data-a="cpRange">Poser ces congés</button></div>
    <p class="tiny" style="margin-top:8px">${st.cp.mode === 'ouvres' ? 'Décompte en jours ouvrés : seuls tes jours travaillés sont comptés.' : 'Décompte en jours ouvrables : un congé le samedi décompte aussi le lundi qui suit (tu reprends le mardi). Les jours fériés ne sont jamais décomptés.'}</p></div>`;

  // périodes
  const groups = [];
  C.pris.forEach(p => { const gl = groups[groups.length - 1]; if (gl && E.dayDiff(gl[gl.length - 1].k, p.k) <= 2) gl.push(p); else groups.push([p]); });
  h += `<div class="card list-cp"><h3>Mes congés</h3><div class="rows">${groups.map(gr => {
    const a = gr[0].k, b = gr[gr.length - 1].k, auto = gr.filter(p => p.auto).length;
    return `<div class="row"><span class="l"><b>${a === b ? dShort(a) : dShort(a) + ' → ' + dShort(b)}</b><br><span class="tiny">${gr.length} j décompté${gr.length > 1 ? 's' : ''}${auto ? ' · dont ' + auto + ' lundi' + (auto > 1 ? 's' : '') + ' de repos' : ''}${b > t ? ' · à venir' : ''}</span></span><span class="v"><button class="btn sm ghost dang" data-a="cpDel" data-ks="${gr.map(p => p.k).join(',')}">Annuler</button></span></div>`;
  }).join('') || '<div class="empty">Aucun congé posé pour l\'instant</div>'}</div></div>`;

  // fin de contrat
  h += `<div class="card"><h3>Fin de contrat<span class="r">J-${F.joursRestants}</span></h3><div class="rows">
    <div class="row"><span class="l">Dernier jour</span><span class="v">${dDate(st.contrat.fin)}</span></div>
    <div class="row"><span class="l">Congés non pris à payer</span><span class="v num">${F.solde} j</span></div>
    <div class="row"><span class="l">Indemnité compensatrice de congés<br><span class="tiny">la plus favorable : 1/10e (${eur(F.dixieme)}) ou maintien (${eur(F.maintien)})</span></span><span class="v num">≈ ${eur(F.iccp)}</span></div>
    <div class="row"><span class="l">Indemnité de fin de contrat (10 %)<br><span class="tiny">« prime de précarité » d'un CDD de surcroît d'activité</span></span><span class="v"><label class="sw"><input type="checkbox" data-set="finContrat.precarite" data-type="bool" ${st.finContrat.precarite ? 'checked' : ''}><span></span></label></span></div>
    ${st.finContrat.precarite ? `<div class="row"><span class="l">Montant estimé</span><span class="v num">≈ ${eur(F.precarite)}</span></div>` : ''}
    ${F.final ? `<div class="row tot"><span class="l">Dernier bulletin estimé (net)</span><span class="v num gold">${eur(F.final.net)}</span></div>` : ''}</div>
    <div class="btns" style="margin-top:10px"><button class="btn" data-a="payYm" data-ym="${F.ymFin}" data-go="1">Voir le dernier bulletin</button><button class="btn" data-a="renew">CDD renouvelé ?</button></div>
    <p class="tiny" style="margin-top:8px">Montants bruts estimés à partir des mois saisis et prévus. Le 1/10e inclut le brut de ton contrat saisonnier (${eur(st.brutSaisonnier)}).</p></div>`;
  { const ch = chomage(); h += `<div class="card"><h3>Après le contrat<span class="r">chômage · estimation</span></h3>${ch.ok ? `<div class="reqbig" style="margin-top:0"><div><span class="tiny">Par jour</span><b class="num">${n2(ch.netJ)} €</b></div><div><span class="tiny">Par mois</span><b class="num gold">≈ ${Math.round(ch.mois).toLocaleString('fr-FR')} €</b></div><div><span class="tiny">Durée</span><b class="num">${Math.round(ch.duree / 30.4 * 10) / 10} mois</b></div></div>
    <div class="rows" style="margin-top:10px"><div class="row"><span class="l">Salaire journalier de référence</span><span class="v num">${eur(ch.sjr)}</span></div>
    <div class="row"><span class="l">Allocation brute</span><span class="v num">${eur(ch.brutJ)} / jour</span></div>
    <div class="row"><span class="l">Durée d’indemnisation</span><span class="v num">${ch.duree} jours</span></div>
    <div class="row"><span class="l">Premiers jours indemnisés vers le</span><span class="v">${dShort(ch.debut)}</span></div></div>
    <p class="tiny" style="margin-top:8px">Calcul sur ${ch.jours} jours d’emploi (depuis le ${dDate(S.settings.saisonDebut || S.settings.contrat.debut)}) et ${eur(ch.salRef)} de salaires bruts. Barèmes Unédic en vigueur : partie fixe 13,18 €, minimum 32,13 €/jour, plafond 75 % du SJR, durée × 0,75. Attente de 7 jours + ${ch.differe} jours de différé pour les congés payés. Seul France Travail fixe le montant définitif : inscris-toi dès le lendemain de la fin du contrat.</p>` : '<p class="help">Il faut au moins 130 jours (6 mois) de travail pour ouvrir des droits.</p>'}</div>`; }
  h += `<div class="card"><details><summary>Comment c'est calculé ?</summary><div class="help">
    <p><b>Acquisition</b> : 2,5 jours ouvrables par mois de contrat (30 par an). Une absence non payée réduit l'acquisition ; un arrêt maladie donne encore 2 jours par mois.</p>
    <p><b>Report</b> : ton contrat (article 8) te fait garder les jours acquis pendant le contrat saisonnier du 10 juillet au 30 septembre 2026, soit environ 6,8 jours arrondis à 7. Ton bulletin de septembre affiche 0 : vérifie ce chiffre sur ton bulletin d'octobre et corrige-le dans Réglages si besoin.</p>
    <p><b>Fin de contrat</b> : les jours non pris sont payés (indemnité compensatrice). Pour la prime de précarité, ton contrat parle à la fois de « surcroît d'activité » et d'emploi « d'usage » : demande à ton employeur si elle est prévue et coupe l'interrupteur si ce n'est pas le cas.</p></div></details></div>`;
  return h;
}

const gp = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
function sp(o, p, v) { const ks = p.split('.'); let a = o; for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]]; a[ks[ks.length - 1]] = v; }
const lab = (l, s) => `<label>${l}${s ? `<small>${s}</small>` : ''}</label>`;
const fNum = (p, l, s) => `<div class="fld">${lab(l, s)}<input type="text" inputmode="decimal" data-set="${p}" data-type="num" value="${numIn(gp(S.settings, p))}"></div>`;
const fTxt = (p, l, s, ph = '', type = 'text') => `<div class="fld">${lab(l, s)}<input type="${type}" data-set="${p}" data-type="str" value="${esc(gp(S.settings, p))}" placeholder="${esc(ph)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
const fDate = (p, l, s) => `<div class="fld">${lab(l, s)}<input type="date" data-set="${p}" data-type="str" value="${esc(gp(S.settings, p))}"></div>`;
const fSw = (p, l, s) => `<div class="fld">${lab(l, s)}<label class="sw"><input type="checkbox" data-set="${p}" data-type="bool" ${gp(S.settings, p) ? 'checked' : ''}><span></span></label></div>`;
const fSel = (p, l, s, opts, type = 'str') => `<div class="fld">${lab(l, s)}<select data-set="${p}" data-type="${type}">${opts.map(o => `<option value="${o[0]}" ${String(gp(S.settings, p)) === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;

const dY = k => cap(dLong(k)) + ' ' + k.slice(0, 4);
const dNum = k => k.slice(8) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4);
const isWorkday = k => { const di = dayOf(k); return di.inC && di.planMin > 0 && !di.hol; };
const offTypes = ['cp', 'recup', 'evt', 'maladie', 'absence'];
function prevWorkday(k) {
  for (let i = 1; i < 30; i++) { const p = E.addDays(k, -i), di = dayOf(p); if (!di.inC) return null; if (di.planMin > 0 && !di.hol && !offTypes.includes(di.type)) return p; }

function nextWorkday(k) {
  for (let i = 1; i < 30; i++) { const p = E.addDays(k, i), di = dayOf(p); if (!di.inC) return null; if (di.planMin > 0 && !di.hol && !offTypes.includes(di.type)) return p; }

function segsWindow(segs, a, b) { const A = E.toMin(a), B = E.toMin(b); if (A == null || B == null || B <= A) return 0; return (segs || []).reduce((t, x) => t + Math.max(0, Math.min(B, E.toMin(x[1])) - Math.max(A, E.toMin(x[0]))), 0); }

function reqCalc(q) {
  const st = S.settings, r = { rows: [], warn: [], sched: [], n: 0, min: 0, ok: true };
  const deb = st.contrat.debut, fin = st.contrat.fin;
  if (q.type === 'echange') {
    const a = q.from, b = q.to;
    if (!a || !b) { r.warn.push('Choisis les deux dates.'); r.ok = false; return r; }

    r.rows.push(['Jour travaillé à la place', dY(b)]);
    r.rows.push(['Semaine', 'S' + E.isoWeek(a) + (E.isoWeek(a) !== E.isoWeek(b) ? ' et S' + E.isoWeek(b) : '')]);
    r.rows.push(['Effet sur la paie', E.mondayOf(a) === E.mondayOf(b) ? 'aucun : ' + hm(da.planMin) + ' déplacées' : 'à vérifier (semaines différentes)']);

  for (let k = a; k <= b && r.sched.length < 250; k = E.addDays(k, 1)) if (isWorkday(k)) r.sched.push(k);
  const already = r.sched.filter(k => ['cp', 'recup', 'evt'].includes(dayOf(k).type) && !(q.applied && q.prev && k in q.prev));

const WMO = c => c === 0 ? ['☀️', 'Grand soleil'] : c <= 2 ? ['🌤️', 'Éclaircies'] : c === 3 ? ['☁️', 'Couvert'] : c <= 48 ? ['🌫️', 'Brouillard'] : c <= 57 ? ['🌦️', 'Bruine'] : c <= 67 ? ['🌧️', 'Pluie'] : c <= 77 ? ['❄️', 'Neige'] : c <= 82 ? ['🌧️', 'Averses'] : c <= 86 ? ['🌨️', 'Averses de neige'] : ['⛈️', 'Orages'];

try { wx = JSON.parse(localStorage.getItem('centime.wx') || 'null'); } catch (e) { }
async function loadWeather(force) {

  if (!force && wx && wx.town === town && Date.now() - wx.t < 30 * 60e3) return;
  if (wxLoading || Date.now() - wxFail < 60e3) return; wxLoading = true;
  try {
    const [la, lo] = TOWNS[town];
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,apparent_temperature,weather_code,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_gusts_10m_max&timezone=Europe%2FParis&forecast_days=3`);

    wx = { t: Date.now(), town, d: await r.json() };

}
function wxAlerts(dl, i) {

  if ((dl.wind_gusts_10m_max[i] || 0) >= 60) a.push(['💨', 'Rafales ' + Math.round(dl.wind_gusts_10m_max[i]) + ' km/h']);

}

/* ---------- compteur en direct ---------- */
const nowMinF = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
function todayEarn() {
  const t = today(), di = dayOf(t); if (!di.inC) return null;
  const nm = nowMinF();
  let min = 0, live = false;
  if (S.clock && S.clock.k === t) {
    min = (S.days[t] && S.days[t].type === 'travail' ? E.sumSeg(S.days[t].seg) : 0) + Math.max(0, nm - E.toMin(S.clock.start)); live = true;
  } else if (di.type === 'travail' && di.confirmed) min = di.worked;
  else if (di.type === 'travail') {
    di.segs.forEach(s => { const a = E.toMin(s[0]), b = E.toMin(s[1]); if (nm > a) { min += Math.min(nm, b) - a; if (nm < b) live = true; } });
  } else return null;
  const ym = contractYm(E.ymOf(t)), P = R.months[ym].pay, ratio = P.brut ? P.netAvantIR / P.brut : 0.78;
  const w = R.weeks.find(x => x.monday === E.mondayOf(t));
  const before = w ? w.days.filter(d => d.k < t).reduce((a, d) => a + d.worked, 0) : 0;
  const s25 = S.settings.hs.seuil25 * 60, restHS = di.planMin === 0 && S.settings.hs.reposEnHS;
  const normal = restHS ? 0 : Math.max(0, Math.min(min, s25 - before)), hs = min - normal;
  const rate = S.settings.tauxHoraire * ratio;
  return { min, live, hs, euros: (normal + hs * (1 + S.settings.hs.maj25 / 100)) * rate / 60, perMin: (hs > 0 ? 1 + S.settings.hs.maj25 / 100 : 1) * rate / 60 };
}
function earnHtml() {
  const e = todayEarn(); if (!e || (!e.min && !e.live)) return '';
  return `<div class="earn"><span class="tiny">${e.live ? 'Gagné aujourd’hui · en direct' : 'Gagné aujourd’hui'}</span><b class="num" id="earn">${n2(e.euros)} €</b><span class="tiny">net estimé${e.hs ? ` · <span class="pos">dont ${hm(e.hs)} en heures sup</span>` : ''}${e.live ? ' · +' + n2(e.perMin * 60) + ' €/h' : ''}</span></div>`;
}
setInterval(() => { if (ui.tab !== 'home' || document.hidden) return; const el = document.getElementById('earn'); if (!el) return; const e = todayEarn(); if (e && e.live) el.textContent = n2(e.euros) + ' €'; }, 1000);

/* ---------- pointage express ---------- */
function expressHint(di) {

}

// heures sup déjà faites (semaines commencées), converties en net estimé
function hsNetCumul() {
  const t = today(), st = S.settings, P = R.months[contractYm(E.ymOf(t))].pay, ratio = P.brut ? P.netAvantIR / P.brut : 0.78;
  return R.weeks.filter(w => w.monday <= t).reduce((a, w) => a + (w.min25 * (1 + st.hs.maj25 / 100) + w.min50 * (1 + st.hs.maj50 / 100)) / 60 * st.tauxHoraire * ratio, 0);
}
function savings() {
  const ep = S.settings.epargne || {}; if (!ep.actif) return null;
  const val = (+ep.deja || 0) + hsNetCumul() * (+ep.part || 0) / 100, obj = +ep.objectif || 1;

}

  const s = savings(); if (!s) return '';

    <p class="tiny">${S.settings.epargne.part} % de tes heures sup nettes + ${eur(+S.settings.epargne.deja || 0)} déjà de côté.</p></div>`;

/* ---------- son « cha-ching » et confettis ---------- */
let actx = null;
function audio() { try { if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); } if (actx.state === 'suspended') actx.resume(); return actx; } catch (e) { return null; } }
function chaChing() {
  if (!(S.settings.fx || {}).sons) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + 0.02, out = a.createGain(); out.gain.value = 0.35; out.connect(a.destination);
  // « ka » : petit bruit métallique
  const buf = a.createBuffer(1, a.sampleRate * 0.06, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3);
  const nz = a.createBufferSource(), bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 2;

    [1, 2.76, 5.4].forEach((m, i) => {
      const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f * m;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol / (i + 1), st + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, st + dur / (i + 1));

  };
  bell(1568, t + 0.07, 0.5, 0.5); bell(2093, t + 0.16, 0.9, 0.6);
}
function confetti(n = 110) {
  if (!(S.settings.fx || {}).confettis) return;
  const cv = document.createElement('canvas'), dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:95;pointer-events:none';
  document.body.appendChild(cv);
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const gold = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#e6bd6a';
  const cols = [gold, '#fff6dc', '#f6d68c', '#32d74b', '#64d2ff', '#ff9f0a'];
  const P = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  const step = now => {
    const el = (now - t0) / 1000; c.clearRect(0, 0, W, H);

function celebrate(msg, big) { confetti(big ? 170 : 100); chaChing(); if (msg) setTimeout(() => toast(msg), 250); }

function chartBars(vals, labels, hi) {
  const W = 340, H = 150, max = Math.max(...vals.map(v => v.v), 1), bw = W / vals.length;
  return `<svg viewBox="0 0 ${W} ${H + 34}" class="chart">${vals.map((v, i) => {
    const h = v.v / max * (H - 24), x = i * bw + bw * 0.16, w = bw * 0.68;
    return `<rect x="${x}" y="${H - h}" width="${w}" height="${h}" rx="6" fill="var(--gold)" opacity="${v.future ? 0.35 : 1}"/><text x="${x + w / 2}" y="${H - h - 6}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx2)">${Math.round(v.v).toLocaleString('fr-FR')}</text><text x="${x + w / 2}" y="${H + 16}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx3)">${labels[i]}</text>`;
  }).join('')}</svg>`;
}
function chartLine(pts, labels, color, unit) {
  const W = 340, H = 120, max = Math.max(...pts, 1), n = pts.length;
  if (n < 2) return '<div class="empty">Pas encore assez de données</div>';
  const xy = pts.map((v, i) => [i / (n - 1) * (W - 20) + 10, H - v / max * (H - 40) - 6]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H + 26}" class="chart"><path d="${d} L${xy[n - 1][0]} ${H} L${xy[0][0]} ${H} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xy[n - 1][0]}" cy="${xy[n - 1][1]}" r="4" fill="${color}"/><text x="${Math.min(W - 4, xy[n - 1][0])}" y="${xy[n - 1][1] - 9}" text-anchor="end" font-size="11" font-weight="800" fill="var(--tx)">${unit(pts[n - 1])}</text>
    <text x="10" y="${H + 18}" font-size="10" fill="var(--tx3)">${labels[0]}</text><text x="${W - 10}" y="${H + 18}" text-anchor="end" font-size="10" fill="var(--tx3)">${labels[n - 1]}</text></svg>`;
}
function stats() {
  const t = today(), st = S.settings, cur = contractYm(E.ymOf(t));
  let hours = 0, days = 0, longest = null, earliest = null, mondays = 0;
  for (let k = st.contrat.debut; k <= t && k <= st.contrat.fin; k = E.addDays(k, 1)) {
    const di = dayOf(k); if (!di.worked) continue;
    hours += di.worked; days++;
    if (!longest || di.worked > longest.m) longest = { k, m: di.worked };
    di.segs.forEach(s => { const a = E.toMin(s[0]); if (earliest == null || a < earliest.m) earliest = { k, m: a, t: s[0] }; });
    if (di.planMin === 0) mondays++;
  }
  const past = Object.values(R.months).filter(m => m.ym <= cur);
  const best = past.slice().sort((a, b) => b.pay.net - a.pay.net)[0];
  const hsMin = R.weeks.filter(w => w.monday <= t).reduce((a, w) => a + w.min25 + w.min50, 0);
  return {
    hours, days, longest, earliest, mondays, best, hsMin,
    hsBrut: R.weeks.filter(w => w.monday <= t).reduce((a, w) => a + (w.min25 * (1 + st.hs.maj25 / 100) + w.min50 * (1 + st.hs.maj50 / 100)) / 60 * st.tauxHoraire, 0), hsNet: hsNetCumul(),

    cp: R.cp.prisPasses, badges: Object.keys(S.badges || {}).length,

}

/* ---------- ESTIMATION CHÔMAGE (barèmes Unédic au 1er juillet 2025, inchangés au 1er juillet 2026) ---------- */
const ARE = { fixe: 13.18, mini: 32.13, plafond: 0.75, coefDuree: 0.75, dureeMin: 182, retraite: 0.03, seuilCSG: 59 };
function chomage() {
  const st = S.settings, F = R.fin;
  const start = st.saisonDebut && st.saisonDebut < st.contrat.debut ? st.saisonDebut : st.contrat.debut;
  const jours = E.dayDiff(start, st.contrat.fin) + 1;
  const salRef = (+st.brutSaisonnier || 0) + F.brutContrat; // hors indemnités de congés et de précarité
  const sjr = salRef / jours;
  const brutJ = Math.min(ARE.plafond * sjr, Math.max(0.404 * sjr + ARE.fixe, 0.57 * sjr, ARE.mini));
  const retr = brutJ - ARE.retraite * sjr >= ARE.mini ? ARE.retraite * sjr : 0;
  const csg = brutJ >= ARE.seuilCSG ? (brutJ - retr) * 0.9825 * 0.067 : 0;
  const netJ = brutJ - retr - csg;
  const duree = Math.max(ARE.dureeMin, Math.floor(jours * ARE.coefDuree));
  const differe = Math.min(30, Math.floor((F.iccp || 0) / sjr));
  const debut = E.addDays(st.contrat.fin, 1 + differe + 7);
  return { jours, salRef, sjr, brutJ, netJ, mois: netJ * 30, duree, differe, debut, ok: jours >= 130 };
}

// « 1 455,51 € », « €1,455.51 », « +1455.51 EUR » → 1455.51
function parseAmount(txt) {
  const re = /([+−-]?)\s*(?:€\s*)?(\d{1,3}(?:[   .,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(€|eur)?/gi;

    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');

    else if (lc >= 0) s = s.length - lc - 1 === 3 && !/[.,]\d{1,2}$/.test(m[2]) ? s.replace(/,/g, '') : s.replace(',', '.');
    else if (ld >= 0 && s.length - ld - 1 === 3) s = s.replace(/\./g, '');
    const v = parseFloat(s); if (!isNaN(v)) found.push({ v: (m[1] && m[1] !== '+' ? -1 : 1) * v, euro: !!m[3] || /€/.test(m[0]) });
  }

}

/* ============================================================
   BANQUE : Revolut via Enable Banking (prestataire agréé DSP2)
   La clé privée reste sur ce téléphone (jamais dans GitHub ni dans les sauvegardes).
   ============================================================ */
const EB_API = 'https://api.enablebanking.com';
const bankCfg = () => S.settings.bank;
const appUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');
const b64urlStr = s => b64u(new TextEncoder().encode(s));
// PKCS#1 (« BEGIN RSA PRIVATE KEY ») → PKCS#8 pour WebCrypto
function derLen(n) { if (n < 128) return [n]; const b = []; while (n) { b.unshift(n & 255); n >>= 8; } return [0x80 | b.length, ...b]; }
function pkcs1to8(der) {
  const algo = [0x30, 0x0d, 0x06, 0x09, 0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01, 0x05, 0x00];
  const oct = [0x04, ...derLen(der.length), ...der], body = [0x02, 0x01, 0x00, ...algo, ...oct];
  return new Uint8Array([0x30, ...derLen(body.length), ...body]);
}
async function importKey(pem) {
  const isPk1 = /BEGIN RSA PRIVATE KEY/.test(pem);
  const b = atob(pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, ''));
  let der = Uint8Array.from(b, c => c.charCodeAt(0));
  if (isPk1) der = pkcs1to8([...der]);
  return crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
}
let ebKeyCache = null;
async function ebJwt() {
  const B = bankCfg();
  if (!ebKeyCache || ebKeyCache.pem !== B.privateKey) ebKeyCache = { pem: B.privateKey, key: await importKey(B.privateKey) };
  const now = Math.floor(Date.now() / 1000);
  const h = b64urlStr(JSON.stringify({ typ: 'JWT', alg: 'RS256', kid: B.appId.trim() }));
  const p = b64urlStr(JSON.stringify({ iss: 'enablebanking.com', aud: 'api.enablebanking.com', iat: now, exp: now + 3600 }));
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', ebKeyCache.key, new TextEncoder().encode(h + '.' + p));
  return h + '.' + p + '.' + b64u(sig);
}
async function eb(path, method = 'GET', body) {
  const B = bankCfg(), relay = B.mode === 'relais';
  if (relay ? !(B.relayUrl && B.relayToken) : !(B.appId && B.privateKey)) throw new Error(relay ? 'adresse ou mot de passe du relais manquant' : 'identifiant d’application ou clé privée manquant');
  const headers = { 'Content-Type': 'application/json' };
  if (relay) headers['X-Relay-Token'] = B.relayToken.trim(); else headers.Authorization = 'Bearer ' + await ebJwt();
  let r;
  try { r = await fetch((relay ? B.relayUrl.trim().replace(/\/$/, '') : EB_API) + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch (e) { throw new Error(relay ? 'relais injoignable (pas de réseau ou mauvaise adresse)' : 'ton iPhone bloque l’accès direct à Enable Banking : passe au relais (étape bonus)'); }
  const txt = await r.text(); let j = null; try { j = JSON.parse(txt); } catch (e) { }
  if (!r.ok) throw new Error((j && (j.message || j.detail || j.error)) || ('erreur ' + r.status) + (r.status === 401 ? ' : identifiant ou clé refusés' : r.status === 403 ? ' : accès refusé' : ''));
  return j;
}
async function bankStart() {
  const B = bankCfg();
  // Revolut en France : selon le compte, la banque est rangée en France (FR) ou en Lituanie (LT, Revolut Bank UAB)
  let asp = null;
  for (const cc of [...new Set([B.country || 'FR', 'FR', 'LT'])]) {
    const list = await eb('/aspsps?country=' + cc + '&psu_type=personal'), all = (list && list.aspsps) || [];
    asp = all.find(a => a.name.toLowerCase() === (B.aspsp || 'revolut').toLowerCase()) || all.find(a => /revolut/i.test(a.name));
    if (asp) break;
  }
  if (!asp) throw new Error('Revolut introuvable chez Enable Banking (France et Lituanie)');
  const days = Math.max(1, Math.min(180, Math.floor((asp.maximum_consent_validity || 7776000) / 86400) - 1));
  const state = 'centime-' + b64u(crypto.getRandomValues(new Uint8Array(9)));
  const res = await eb('/auth', 'POST', { access: { valid_until: new Date(Date.now() + days * 864e5).toISOString() }, aspsp: { name: asp.name, country: asp.country }, state, redirect_url: appUrl(), psu_type: 'personal', language: 'fr' });
  B.aspsp = asp.name; B.pendingState = state; save(false);
  return res.url;
}
async function bankSession(code) {
  const B = bankCfg();
  const s = await eb('/sessions', 'POST', { code: code.trim() });
  const accs = s.accounts || [];
  const acc = accs.find(a => (a.currency || 'EUR') === 'EUR') || accs[0];
  if (!acc) throw new Error('aucun compte autorisé');
  Object.assign(B, { session: s.session_id, account: acc.uid, accountName: acc.name || (acc.account_id && acc.account_id.iban ? '…' + acc.account_id.iban.slice(-4) : 'Compte'), validUntil: (s.access && s.access.valid_until) || '', lastErr: '', pendingState: '' });
  save(false);
  return accs.length;
}
function txToSalary(t) {
  const amt = parseFloat((t.transaction_amount || {}).amount);
  const credit = t.credit_debit_indicator ? t.credit_debit_indicator === 'CRDT' : amt > 0;
  if (!credit || !(Math.abs(amt) > 0) || (t.status && t.status !== 'BOOK')) return null;
  const k = t.booking_date || t.value_date || t.transaction_date; if (!k) return null;
  const desc = [(t.debtor || {}).name, ...(t.remittance_information || []), t.note].filter(Boolean).join(' ');
  const kws = String(S.settings.revolut.libelle || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
  if (!(kws.length ? kws.some(w => desc.toLowerCase().includes(w)) : /salaire|paie|salary/i.test(desc))) return null;
  return { k: k.slice(0, 10), ym: salaryMonth(k.slice(0, 10)), net: Math.round(Math.abs(amt) * 100) / 100, desc };
}
let bankBusy = null;
function bankSync(manual) {
  if (bankBusy) { if (manual) toast('Lecture en cours…'); return bankBusy; }
  bankBusy = bankSyncRun(manual).finally(() => { bankBusy = null; });
  return bankBusy;
}
async function bankSyncRun(manual) {
  const B = bankCfg(); if (!B.account) { if (manual) toast('Connecte d’abord ton compte Revolut'); return; }
  try {
    const from = E.addDays(today(), -75), found = []; let ck = null, n = 0;
    do {
      const q = '/accounts/' + encodeURIComponent(B.account) + '/transactions?date_from=' + from + (ck ? '&continuation_key=' + encodeURIComponent(ck) : '');
      const r = await eb(q); (r.transactions || []).forEach(t => { const x = txToSalary(t); if (x) found.push(x); });
      ck = r.continuation_key; n++;
    } while (ck && n < 10);
    B.lastSync = Date.now(); B.lastErr = '';
    const fresh = found.filter(f => { const mo = S.months[f.ym] || {}; return !(mo.reel && mo.reel.net != null); }).sort((a, b) => a.k < b.k ? -1 : 1);
    fresh.forEach(f => saveSalary(f.ym, f.net, f.k));
    save(); recompute(); render();
    if (fresh.length) { const last = fresh[fresh.length - 1]; slotMachine(last.ym, last.net); }
    else if (manual) toast(found.length ? '✓ Synchronisé : rien de nouveau' : '✓ Synchronisé : aucun salaire sur 75 jours (libellé « ' + S.settings.revolut.libelle + ' » ?)');
  } catch (e) {
    B.lastErr = e.message; save(false);
    if (/expired|expir|session|consent|401/i.test(e.message) && B.session) B.lastErr = 'Autorisation Revolut expirée : reconnecte ton compte';
    if (manual) toast('Revolut : ' + B.lastErr);
    if (ui.tab === 'settings') render();
  }
}
function bankAuto() {
  const B = bankCfg();
  if (B.account && Date.now() - Math.max(B.lastSync || 0, B.lastTry || 0) > 30 * 60e3 && navigator.onLine !== false) { B.lastTry = Date.now(); save(false); bankSync(false); }
  pushRefresh(false);
}

      ${same ? '<p style="max-width:320px;text-align:center;color:rgba(255,255,255,.7)">Connexion en cours…</p>' : `<p style="max-width:330px;text-align:center;color:rgba(255,255,255,.75);line-height:1.45">Dernière étape : <b>copie ce code</b>, ouvre Centime depuis son icône, puis Réglages → Revolut → <b>Coller le code</b>.</p>
      <div style="max-width:330px;word-break:break-all;background:rgba(255,255,255,.08);border-radius:12px;padding:12px;font:600 13px ui-monospace,monospace;color:#f6d68c" id="ebCode">${esc(code)}</div>
      <button class="btn pri" style="flex:0 0 auto;min-height:50px;width:100%;max-width:300px" id="ebCopy">📋 Copier le code</button>
      <p style="font-size:12px;color:rgba(255,255,255,.45)">Le code ne sert qu’une fois et expire vite : colle-le tout de suite.</p>`}`;
  document.body.appendChild(el);
  const cp = document.getElementById('ebCopy');
  if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(code); cp.textContent = '✓ Copié ! Ouvre maintenant Centime'; } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('ebCode')); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = 'Sélectionné : touche « Copier »'; } };
  if (same) bankSession(code).then(n => { history.replaceState(null, '', appUrl()); el.remove(); toast('✓ Revolut connecté (' + n + ' compte' + (n > 1 ? 's' : '') + ')'); render(); bankSync(true); pushRefresh(true); }).catch(e => { el.querySelector('p').textContent = 'Erreur : ' + e.message; });
  return true;
}

/* ----- carte Réglages : assistant de connexion ----- */
function pushBlock(B, relay) {
  const head = '<div class="bsec"><div class="lb">🔔 Me prévenir quand le salaire tombe</div>';
  if (!relay) return head + '<p class="tiny">Disponible en passant par le relais (étape bonus).</p></div>';
  if (B.push) return head + `<p class="tiny">✓ Activé. Le relais vérifie ton compte 3 fois par jour (vers 7 h 30, 12 h 30 et 18 h 30), même quand Centime est fermé. Touche la notification : le salaire s’enregistre et la machine à sous se lance.</p>
    <div class="btns" style="margin-top:8px"><button class="btn" data-a="pushTest">Envoyer un test</button><button class="btn" data-a="pushOff">Désactiver</button></div></div>`;
  if (!pushOk() || !standalone()) return head + '<p class="tiny">Ouvre Centime depuis son <b>icône sur l’écran d’accueil</b> (pas depuis Safari) pour activer les notifications. Pas encore installé ? Dans Safari : Partager → « Sur l’écran d’accueil ».</p></div>';
  return head + `<p class="tiny">Une notification sur ton iPhone dès que le virement arrive, même appli fermée.</p>
    <div class="btns" style="margin-top:8px"><button class="btn pri" data-a="pushOn">🔔 Activer les notifications</button></div></div>`;
}
function bankCard() {
  const B = bankCfg(), connected = !!B.account, relay = B.mode === 'relais';
  const exp = B.validUntil ? new Date(B.validUntil) : null, days = exp ? Math.round((exp - Date.now()) / 864e5) : null;
  if (connected) return `<div class="card"><h3>Revolut connecté<span class="r"><span class="badge ${days != null && days < 7 ? 'o' : 'g'}">✓ ${esc(B.accountName || 'compte')}</span></span></h3>
    <div class="rows"><div class="row"><span class="l">Dernière lecture</span><span class="v">${B.lastSync ? new Date(B.lastSync).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : 'jamais'}</span></div>
    ${days != null ? `<div class="row"><span class="l">Autorisation valable encore</span><span class="v">${days} jours</span></div>` : ''}
    <div class="row"><span class="l">Passage par</span><span class="v">${relay ? 'ton relais' : 'direct'}</span></div></div>
    ${B.lastErr ? `<p class="tiny neg" style="margin-top:6px">${esc(B.lastErr)}</p>` : ''}
    <p class="tiny" style="margin:8px 0 10px">À chaque ouverture de Centime (au plus toutes les 30 min), l’appli lit tes virements reçus : dès que ton salaire apparaît, la machine à sous se lance.</p>
    <div class="btns"><button class="btn pri" data-a="bankSync">🔄 Lire maintenant</button><button class="btn" data-a="bankAuth">Renouveler</button></div>
    ${pushBlock(B, relay)}
    ${relay && B.privateKey ? `<div class="bsec"><div class="lb">🔒 Ta clé privée</div><p class="tiny">Le relais a déjà ta clé : elle n’a plus besoin d’être dans ce téléphone.</p><div class="btns" style="margin-top:8px"><button class="btn" data-a="keyForget">🗑️ Retirer la clé de ce téléphone</button></div></div>` : ''}
    <div class="btns" style="margin-top:12px"><button class="btn dang" data-a="bankOff">Déconnecter</button></div></div>`;
  const step = (n, t, body) => `<div class="step"><b>${n}</b><div style="flex:1;min-width:0"><div class="st-t">${t}</div>${body}</div></div>`;
  return `<div class="card"><h3>Connexion Revolut<span class="r">via Enable Banking</span></h3>
    <p class="tiny" style="margin-bottom:6px">Lecture seule, gratuite pour un usage perso. Tu t’identifies chez Revolut : Centime ne voit jamais ton mot de passe.</p>
    ${step(1, 'Crée ton compte et ton application', `<div class="tiny">Sur Enable Banking : application <b>Production</b>, nom « Centime », et cette adresse de redirection :</div>
      <div class="copyrow"><code>${esc(appUrl())}</code><button class="btn sm" data-a="copyTxt" data-t="${esc(appUrl())}">Copier</button></div>
      <a class="btn sm" style="margin-top:8px" href="https://enablebanking.com/cp/applications" target="_blank" rel="noopener">Ouvrir Enable Banking ↗</a>`)}
    ${step(2, 'Relie ton compte Revolut à l’application', '<div class="tiny">Dans la liste de tes applications : « Activate by linking accounts » → Revolut → autorise dans l’appli Revolut. L’application passe en « Restricted production ».</div>')}
    ${step(3, 'Donne la clé à Centime', `<div class="fld" style="padding:6px 0;border:0"><label>Identifiant d’application<small>Application ID (format xxxxxxxx-xxxx-…)</small></label><input type="text" data-set="bank.appId" data-type="str" value="${esc(B.appId)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ID"></div>
      <input type="file" id="pemFile" accept=".pem,.key,.txt,application/x-pem-file,text/plain" style="display:none">
      <div class="btns"><button class="btn sm" style="flex:1" data-a="pemPick">${B.privateKey ? '✓ Clé privée chargée · changer' : '🔑 Choisir le fichier .pem'}</button></div>
      <div class="tiny" style="margin-top:6px">Le fichier téléchargé à l’étape 1 (dans Fichiers → Téléchargements). Il reste sur ce téléphone, jamais dans GitHub.</div>`)}
    ${step(4, 'Connecte Revolut à Centime', `<button class="btn pri" style="width:100%;margin-top:4px" data-a="bankAuth">🔗 Autoriser Centime chez Revolut</button>
      <div class="tiny" style="margin-top:8px">Revolut te demande de valider, puis une page « Revolut a autorisé Centime » s’ouvre dans Safari avec un code : copie-le et reviens ici.</div>
      <input class="inp" id="ebCodeIn" placeholder="Colle le code ici" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:8px">
      <button class="btn" style="width:100%;margin-top:8px" data-a="bankCode">✓ Valider le code</button>`)}
    ${B.lastErr ? `<p class="tiny neg" style="margin-top:8px;font-weight:700">${esc(B.lastErr)}</p>` : ''}
    <details ${relay ? 'open' : ''}><summary>Étape bonus : passer par un relais</summary><div class="help">
      <p>Seulement si l’étape 4 affiche « ton iPhone bloque l’accès direct ». Le relais est un mini-serveur gratuit (Supabase ou Cloudflare) qui garde ta clé et parle à Enable Banking à la place de l’iPhone.</p>
      ${fSel('bank.mode', 'Passage', '', [['direct', 'Direct'], ['relais', 'Par mon relais']])}
      ${relay ? fTxt('bank.relayUrl', 'Adresse du relais', '', 'https://xxxx.supabase.co/functions/v1/relais') + fTxt('bank.relayToken', 'Mot de passe du relais', '', 'RELAY_TOKEN', 'password') : ''}
      <div class="btns" style="margin-top:8px"><button class="btn sm" style="flex:1" data-a="copyRelay">📋 Copier le code du relais</button></div>
      ${B.privateKey ? '<div class="btns" style="margin-top:8px"><button class="btn sm" style="flex:1" data-a="copyKey">🔑 Copier ma clé pour PRIVATE_KEY</button></div>' : ''}</div></details></div>`;
}

Object.assign(A, {
  copyTxt(el) { navigator.clipboard.writeText(el.dataset.t).then(() => toast('Copié ✓'), () => toast('Appuie longuement sur l’adresse pour la copier')); },
  pemPick() { document.getElementById('pemFile').click(); },
  copyKey() {
    const k = bankCfg().privateKey;
    const manual = () => prompt('Copie ta clé (touche le texte → Tout sélectionner → Copier), puis colle-la dans le secret PRIVATE_KEY :', k);
    if (!navigator.clipboard) return manual();
    navigator.clipboard.writeText(k).then(() => toast('🔑 Clé copiée (' + k.length + ' caractères) : colle-la dans PRIVATE_KEY'), manual);
  },
  async bankAuth(el) {
    const B = bankCfg(); el.disabled = true; const old = el.textContent; el.textContent = 'Connexion à Enable Banking…';
    try { const url = await bankStart(); B.lastErr = ''; save(false); location.href = url; }
    catch (e) { B.lastErr = e.message; save(false); render(); toast('Revolut : ' + e.message); }
    finally { el.disabled = false; el.textContent = old; }
  },
  async bankCode() {
    const c = (document.getElementById('ebCodeIn') || {}).value || ''; if (!c.trim()) { toast('Colle le code reçu dans Safari'); return; }
    try { const n = await bankSession(c); toast('✓ Revolut connecté (' + n + ' compte' + (n > 1 ? 's' : '') + ')'); render(); bankSync(true); pushRefresh(true); }
    catch (e) { bankCfg().lastErr = e.message; save(false); render(); toast('Revolut : ' + e.message); }
  },
  bankSync() { bankSync(true); },
  async bankOff() {
    if (!confirm('Déconnecter Revolut de Centime ? L’autorisation est aussi annulée chez Enable Banking.')) return;
    const B = bankCfg();
    if (B.session) { try { await eb('/sessions/' + encodeURIComponent(B.session), 'DELETE'); } catch (e) { } }
    if (B.push) await pushDisable();
    Object.assign(B, { session: '', account: '', accountName: '', validUntil: '', lastSync: 0, lastErr: '' }); save(false); render(); toast('Revolut déconnecté');
  },
  pushOn(el) {
    el.disabled = true; el.textContent = 'Activation…';
    pushEnable().then(() => { render(); toast('🔔 Notifications activées : regarde, un test arrive'); })
      .catch(e => { toast('Notifications : ' + e.message); el.disabled = false; el.textContent = '🔔 Activer les notifications'; });
  },
  async pushTest() {
    try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (!sub) throw new Error('réactive les notifications'); await eb('/push/test', 'POST', { endpoint: sub.endpoint }); toast('Test envoyé : il arrive dans quelques secondes'); }
    catch (e) { toast('Notifications : ' + e.message); if (/réactive|pas abonné|expiré/.test(e.message)) { bankCfg().push = null; save(false); render(); } }
  },
  async pushOff() { if (!confirm('Ne plus être prévenu quand le salaire tombe ?')) return; await pushDisable(); render(); toast('Notifications désactivées'); },
  keyForget() { if (!confirm('Retirer la clé privée de ce téléphone ? Le relais la garde : tout continue de marcher.')) return; bankCfg().privateKey = ''; save(false); render(); toast('🔒 Clé retirée de ce téléphone'); },
  async copyRelay() {
    try { const r = await fetch('relay/worker.js', { cache: 'no-store' }); const t = await r.text(); await navigator.clipboard.writeText(t); toast('Code du relais copié ✓'); }
    catch (e) { toast('Ouvre ' + appUrl() + 'relay/worker.js et copie tout le texte'); }
  },
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.id !== 'pemFile' || !el.files[0]) return;
  const txt = await el.files[0].text();
  if (!/BEGIN (RSA )?PRIVATE KEY/.test(txt)) { toast('Ce fichier n’est pas une clé privée (.pem)'); el.value = ''; return; }
  try { await importKey(txt); bankCfg().privateKey = txt.trim(); bankCfg().lastErr = ''; save(false); render(); toast('🔑 Clé privée enregistrée sur ce téléphone'); }
  catch (x) { toast('Clé illisible : ' + x.message); }
  el.value = '';
});

/* ---------- démarrage ---------- */
recompute();
checkBadges(false);
render();
if (!bankReturnPage()) splash();
loadWeather();
setInterval(() => loadWeather(), 30 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) bankAuto(); });

</script>
</body>
</html>
