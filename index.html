<style>
:root{
  --bg:#0a0a0c;--bg2:#121215;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
  --tx:#f5f5f7;--tx2:#a1a1a6;--tx3:#6e6e73;
  --gold:#e6bd6a;--gold2:#b8862f;--goldbg:rgba(230,189,106,.13);--goldtx:#1a1306;
  --green:#32d74b;--blue:#64d2ff;--purple:#bf5af2;--red:#ff453a;--orange:#ff9f0a;
  --glass:rgba(18,18,21,.72);--shadow:0 10px 30px rgba(0,0,0,.35);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#f2f2f7;--bg2:#ffffff;--card:#ffffff;--card2:#f0f0f4;--line:rgba(0,0,0,.08);
  --tx:#1c1c1e;--tx2:#5f5f64;--tx3:#8e8e93;
  --gold:#a8771f;--gold2:#8a5f12;--goldbg:rgba(168,119,31,.11);--goldtx:#fff;
  --green:#1f9d3a;--blue:#0a84ff;--purple:#8e44ad;--red:#d70015;--orange:#c96a00;
  --glass:rgba(249,249,251,.8);--shadow:0 6px 20px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 85% -10%,rgba(230,189,106,.16),transparent 60%),radial-gradient(80% 50% at 0% 0%,rgba(100,210,255,.06),transparent 60%)}
[data-theme=light] body::before{background:radial-gradient(120% 70% at 85% -10%,rgba(168,119,31,.10),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#view{position:relative;z-index:1;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 104px);max-width:640px;margin:0 auto}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* en-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 16px}
.top small{display:block;color:var(--tx2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.top h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.top .act{display:flex;gap:8px}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.icbtn svg{width:19px;height:19px}
.icbtn.ok{color:var(--green)}.icbtn.err{color:var(--red)}.icbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h3{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .r{text-transform:none;letter-spacing:0;font-weight:600;color:var(--tx3)}
.hero{position:relative;overflow:hidden;padding:20px 18px 18px;background:linear-gradient(160deg,rgba(230,189,106,.22),rgba(230,189,106,.04) 55%,rgba(255,255,255,.03));border-color:rgba(230,189,106,.25)}
[data-theme=light] .hero{background:linear-gradient(160deg,rgba(168,119,31,.16),#fff 60%)}
.hero .lbl{font-size:13px;color:var(--tx2);font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 10px}
.hero .big span{font-size:24px;font-weight:700;color:var(--tx2);margin-left:4px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--tx2)}
.hero .sub b{color:var(--tx);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--goldbg);color:var(--gold)}
.badge.g{background:rgba(50,215,75,.14);color:var(--green)}.badge.o{background:rgba(255,159,10,.15);color:var(--orange)}
.badge.b{background:rgba(100,210,255,.14);color:var(--blue)}.badge.p{background:rgba(191,90,242,.15);color:var(--purple)}.badge.r{background:rgba(255,69,58,.14);color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.grid2 button.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;font:inherit;color:inherit}
.stat .k{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.stat .v small{font-size:14px;font-weight:700;color:var(--tx2)}
.stat .d{font-size:13px;color:var(--tx2);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--gold)}
/* lignes */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0;padding-top:2px}
.row .l{color:var(--tx2);flex:1;min-width:0}.row .l b{color:var(--tx);font-weight:600}
.row .v{font-weight:700;text-align:right;white-space:nowrap;flex:0 0 auto}
.row.tot .l{color:var(--tx);font-weight:800}.row.tot .v{font-size:17px}
.muted{color:var(--tx2)}.tiny{font-size:12px;color:var(--tx3)}
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}
/* boutons */
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--goldtx);border:0;box-shadow:0 6px 18px rgba(230,189,106,.25)}
.btn.ghost{background:transparent}
.btn.dang{color:var(--red)}
.btn.sm{min-height:36px;font-size:14px;border-radius:11px;padding:0 12px;flex:0 0 auto}
.btn svg{width:18px;height:18px}
/* progression */
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar i.hs{background:var(--green);left:auto}
/* calendrier */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:18px;font-weight:800;text-transform:capitalize}
.cal{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:5px}
.cal .wkn{font-size:10px;font-weight:800;color:var(--gold);display:flex;align-items:center;justify-content:center;border-radius:8px;letter-spacing:-.02em;opacity:.75}
.cal .wkn.now{background:var(--goldbg);opacity:1}
.cal .wd{font-size:11px;font-weight:700;color:var(--tx3);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1/1.12;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;font-size:12px;position:relative;border:1.5px solid transparent;min-width:0}
.cd .n{font-weight:700;font-size:14px}
.cd .t{font-size:11px;font-weight:700;white-space:nowrap}
.cd.w{background:var(--goldbg)}.cd.w .t{color:var(--gold)}
.cd.plan{background:transparent;border:1.5px dashed var(--line)}.cd.plan .t{color:var(--tx3)}
.cd.hsday{background:rgba(50,215,75,.16);border-color:transparent}.cd.hsday .t{color:var(--green)}.cd.plan.hsday{border:1.5px dashed rgba(50,215,75,.5)}
.cd.cp{background:rgba(100,210,255,.15)}.cd.cp .t{color:var(--blue)}
.cd.ferie{background:rgba(191,90,242,.15)}.cd.ferie .t{color:var(--purple)}
.cd.maladie{background:rgba(255,69,58,.14)}.cd.maladie .t{color:var(--red)}
.cd.absence{background:rgba(255,159,10,.15)}.cd.absence .t{color:var(--orange)}
.cd.recup{background:rgba(50,215,75,.12)}.cd.recup .t{color:var(--green)}
.cd.repos{background:transparent;opacity:.55}
.cd.hors{background:transparent;opacity:.22}
.cd.today{border-color:var(--gold)!important;border-style:solid!important}
.cd .plus{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.cd .cpx{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--tx2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.week{padding:12px 0;border-top:1px solid var(--line)}
.week .wtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week .wtop>b{font-size:17px;white-space:nowrap}
.week:first-child{border-top:0;padding-top:0}
.week .wn{font-weight:800}.week .wr{font-size:13px;color:var(--tx2)}
.week .wh{text-align:right}.week .wh b{font-size:17px}
.week .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
/* puces de mois */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--tx2);text-transform:capitalize}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
/* bulletin */
.bul .grp{font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 4px}
.bul .grp:first-child{margin-top:0}
.bl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.bl .bn{font-size:14px;font-weight:600}
.bl .bd{font-size:12px;color:var(--tx3);margin-top:1px}
.bl .bm{font-weight:700;white-space:nowrap;font-size:15px}
.bl.total .bn,.bl.sub .bn{font-weight:800}.bl.total .bm,.bl.sub .bm{font-weight:800}
.bl.sub{background:var(--card2);margin:4px -10px;padding:9px 10px;border-radius:10px;border:0}
.bl.grand{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--goldtx);margin:8px -10px 0;padding:13px 10px;border-radius:12px;border:0}
.bl.grand .bn,.bl.grand .bm{font-weight:900;font-size:17px}
.bl.hs .bm{color:var(--green)}.bl.extra .bn{color:var(--gold)}
/* formulaires */
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fld:first-of-type{border-top:0}
.fld label{font-size:15px;flex:1}.fld label small{display:block;font-size:12px;color:var(--tx3)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=password],.fld select,.inp{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;width:150px;text-align:right;outline:none;min-height:40px}
.fld input:focus,.inp:focus{border-color:var(--gold)}
.fld input[type=date]{width:160px}
.inp{text-align:left;width:100%}
input[type=time]{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:17px;font-weight:700;min-height:44px;width:100%;text-align:center;outline:none;-webkit-appearance:none;appearance:none}
.sw{position:relative;display:inline-block;vertical-align:middle;width:51px;height:31px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:.2s}
.sw span::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:1px;left:1px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--green);border-color:var(--green)}
.sw input:checked+span::after{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--tx2)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.2)}
[data-theme=light] .seg button.on{background:#fff}
.seg.types{grid-template-columns:repeat(3,1fr);grid-auto-flow:row}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--gold);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ›";}
details[open] summary::after{content:" ⌄"}
.help{font-size:14px;color:var(--tx2);line-height:1.5}
.help p{margin-top:8px}.help ol{margin:8px 0 0 18px}.help li{margin-top:4px}
/* plages horaires */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 36px;gap:8px;align-items:center}
.slot input{min-width:0}
.slot .del svg{width:16px;height:16px}
.slot .ar{color:var(--tx3);font-weight:700}
.slot .del{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--red);background:rgba(255,69,58,.1)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qk button{padding:7px 11px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:700;border:1px solid var(--line)}
.daytot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.daytot b{font-size:28px;font-weight:800;letter-spacing:-.03em}
/* planning */
.pl{padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl .ph{display:flex;justify-content:space-between;align-items:center}
.pl .ph b{font-size:15px}
.pl .pr{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;margin-top:8px;align-items:center}
.pl .pr span{font-size:12px;color:var(--tx3);font-weight:700;width:70px}
.pl .pr input{font-size:15px;min-height:38px;padding:6px 2px;min-width:0}
/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--sab) + 6px);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--line);display:flex;justify-content:space-around}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--tx3);padding:4px 0;max-width:100px}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--gold)}
/* feuille modale */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sab) + 20px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.4);max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet{visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:99px;background:var(--tx3);opacity:.5;margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.sheet .sec{margin-top:16px}
.sheet .sec>.lb{font-size:12px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
/* toast */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,-140%);z-index:60;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
/* divers */
.alert{display:flex;gap:12px;align-items:center;background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.3);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;width:100%;text-align:left}
.alert b{color:var(--orange)}
.alert .go{margin-left:auto;font-weight:800;color:var(--orange);white-space:nowrap}
.today .when{font-size:20px;font-weight:800;text-transform:capitalize}
.today .st{color:var(--tx2);font-size:14px;margin:2px 0 14px}
.live{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.ring{width:84px;height:84px;flex:0 0 auto}
.wk{display:flex;align-items:center;gap:16px}
.wk .info{flex:1}
.wk .info .hh{font-size:28px;font-weight:800;letter-spacing:-.03em}
.list-cp .row .l{color:var(--tx)}
.empty{text-align:center;color:var(--tx3);padding:14px 0;font-size:14px}
.ver{display:flex;align-items:center;gap:10px}
.ver .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(50,215,75,.15);color:var(--green);font-weight:900;flex:0 0 auto}
.ver.ko .ic{background:rgba(255,69,58,.15);color:var(--red)}
.chk{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13px;margin-top:8px}
.chk span:nth-child(3n+2),.chk span:nth-child(3n){text-align:right;font-variant-numeric:tabular-nums}
.welcome .logo{width:76px;height:76px;border-radius:20px;margin:6px auto 14px;display:block;box-shadow:0 10px 30px rgba(230,189,106,.25)}
.welcome h2{text-align:center;text-transform:none}
.welcome p.c{text-align:center;color:var(--tx2);margin:6px 0 14px}

/* ===== écran de chargement ===== */
#splash{position:fixed;inset:0;z-index:100;background:#08080a;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#f5f5f7;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),filter .55s ease}
#splash.out{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none}
#splash .sp-glow{position:absolute;width:760px;height:760px;left:50%;top:44%;margin:-380px 0 0 -380px;border-radius:50%;
  background:radial-gradient(circle,rgba(230,189,106,.30) 0%,rgba(230,189,106,.12) 18%,rgba(230,189,106,.045) 34%,rgba(230,189,106,.012) 48%,rgba(230,189,106,0) 62%);animation:spBreath 2.6s ease-in-out infinite;opacity:0;animation-delay:.1s}
#splash .sp-grain{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 110%,rgba(100,210,255,.06),transparent 60%),radial-gradient(90% 60% at 50% -10%,rgba(230,189,106,.10),transparent 60%)}
#splash .sp-center{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-6vh}
#splash .sp-logo{width:150px;height:150px;position:relative}
#splash svg{width:100%;height:100%;overflow:visible}
#splash .sp-orbit{fill:none;stroke:url(#spg);stroke-width:1.2;stroke-dasharray:.18 .07;opacity:0;transform-origin:60px 60px;animation:spIn .6s .5s forwards,spSpin 9s linear infinite}
#splash .sp-orbit2{fill:none;stroke:rgba(230,189,106,.16);stroke-width:.6;opacity:0;animation:spIn .8s .7s forwards}
#splash .sp-c{fill:none;stroke:url(#spg);stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(230,189,106,.45));animation:spDraw 1s cubic-bezier(.65,0,.35,1) .15s forwards}
#splash .sp-bar{fill:url(#spg);transform-box:fill-box;transform-origin:center;transform:scaleY(0);filter:drop-shadow(0 0 6px rgba(230,189,106,.45));animation:spBar .55s cubic-bezier(.2,.9,.25,1.25) .85s forwards}
#splash .sp-shine{position:absolute;inset:-10%;border-radius:50%;background:linear-gradient(115deg,transparent 40%,rgba(255,244,214,.55) 50%,transparent 60%);mix-blend-mode:overlay;transform:translateX(-120%);animation:spShine 1.1s ease-in-out 1.25s forwards;pointer-events:none}
#splash .sp-word{margin-top:26px;font:800 30px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:.9em;padding-left:.9em;opacity:0;filter:blur(10px);
  background:linear-gradient(90deg,#b8862f 0%,#f6d68c 25%,#fff6dc 50%,#f6d68c 75%,#b8862f 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:spWord .9s cubic-bezier(.2,.8,.2,1) .7s forwards,spShimmer 2.4s linear 1.2s infinite}
#splash .sp-tag{margin-top:14px;font:600 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(245,245,247,.55);opacity:0;transform:translateY(8px);animation:spUp .7s ease 1.05s forwards}
#splash .sp-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;animation:spUp .6s ease .95s forwards}
#splash .sp-net{display:flex;flex-direction:column;align-items:center;gap:4px}
#splash .sp-net span{font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,245,247,.45)}
#splash .sp-net b{font:800 22px/1.1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#f5f5f7}
#splash .sp-prog{width:132px;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
#splash .sp-prog i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#b8862f,#f6d68c);transform:scaleX(0);transform-origin:left;animation:spProg 1.9s cubic-bezier(.4,0,.2,1) .15s forwards}
#splash .sp-sig{font:600 10px/1 -apple-system,system-ui,sans-serif;letter-spacing:.2em;color:rgba(245,245,247,.25);text-transform:uppercase}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spBar{to{transform:scaleY(1)}}
@keyframes spIn{to{opacity:1}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spShine{to{transform:translateX(120%)}}
@keyframes spWord{to{opacity:1;filter:blur(0);letter-spacing:.42em;padding-left:.42em}}
@keyframes spShimmer{to{background-position:-220% 0}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spProg{to{transform:scaleX(1)}}
@keyframes spBreath{0%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}100%{opacity:.55;transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-grain"></div><div class="sp-glow"></div>
  <div class="sp-center">
    <div class="sp-logo">
      <svg viewBox="0 0 120 120">
        <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe2a4"/><stop offset=".5" stop-color="#e6bd6a"/><stop offset="1" stop-color="#a8721f"/></linearGradient></defs>
        <circle class="sp-orbit2" cx="60" cy="60" r="58"/>
        <circle class="sp-orbit" cx="60" cy="60" r="52" pathLength="1"/>
        <path class="sp-c" d="M86.79 39.07 A34 34 0 1 0 86.79 80.93" pathLength="1"/>
        <rect class="sp-bar" x="58" y="6" width="8" height="108" rx="4"/>
      </svg>
    </div>
    <div class="sp-word">CENTIME</div>
    <div class="sp-tag">Heures · Congés · Salaire</div>
  </div>
  <div class="sp-foot">
    <div class="sp-net"><span id="spLbl">Calcul de ta paie</span><b id="spNet">0,00 €</b></div>
    <div class="sp-prog"><i></i></div>
    <div class="sp-sig">Au centime près</div>
  </div>
</div>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button class="tab" data-a="tab" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button class="tab" data-a="tab" data-t="hours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Heures</button>
  <button class="tab" data-a="tab" data-t="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M17.5 6.2A7 7 0 1 0 17.5 17.8M4 10h10M4 14h10"/></svg>Paie</button>
  <button class="tab" data-a="tab" data-t="cp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Congés</button>
  <button class="tab" data-a="tab" data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>Réglages</button>
</nav>
<div class="scrim" id="scrim" data-a="closeSheet"></div>
<section class="sheet" id="sheet"></section>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   CENTIME — moteur de calcul (heures, paie, congés)
   Calé sur le bulletin Cerdagne Meubles de septembre 2026.
   ============================================================ */
const Engine = (() => {
  /* ---------- arrondi au centime (demi supérieur, robuste aux flottants) ---------- */
  const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-6) / 100; };
  const r4 = x => { const s = x < 0 ? -1 : 1; return s * Math.floor(Math.abs(x) * 10000 + 0.5 + 1e-6) / 10000; };

  /* ---------- dates (clés 'AAAA-MM-JJ', calcul en UTC) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const toKey = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (k, n) => { const d = fromKey(k); d.setUTCDate(d.getUTCDate() + n); return toKey(d); };
  const dow = k => fromKey(k).getUTCDay(); // 0 = dimanche
  const ymOf = k => k.slice(0, 7);
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); };
  const mondayOf = k => addDays(k, -((dow(k) + 6) % 7));
  const dayDiff = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
  const isoWeek = k => {
    const d = fromKey(k); const n = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - n);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - y0) / 864e5 + 1) / 7);
  };
  const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  /* ---------- jours fériés français ---------- */
  const easter = y => {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return toKey(new Date(Date.UTC(y, mo - 1, da)));
  };
  const holCache = {};
  const holidays = y => {
    if (holCache[y]) return holCache[y];
    const e = easter(y), h = {};
    h[y + '-01-01'] = "Jour de l'an"; h[addDays(e, 1)] = 'Lundi de Pâques'; h[y + '-05-01'] = 'Fête du Travail';
    h[y + '-05-08'] = 'Victoire 1945'; h[addDays(e, 39)] = 'Ascension'; h[addDays(e, 50)] = 'Lundi de Pentecôte';
    h[y + '-07-14'] = 'Fête nationale'; h[y + '-08-15'] = 'Assomption'; h[y + '-11-01'] = 'Toussaint';
    h[y + '-11-11'] = 'Armistice'; h[y + '-12-25'] = 'Noël';
    return (holCache[y] = h);
  };
  const holidayName = k => holidays(+k.slice(0, 4))[k] || null;

  /* ---------- heures ---------- */
  const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const segMin = s => { const a = toMin(s[0]), b = toMin(s[1]); if (a == null || b == null) return 0; return b >= a ? b - a : b + 1440 - a; };
  const sumSeg = segs => (segs || []).reduce((t, s) => t + segMin(s), 0);
  const ticketEligible = segs => {
    let am = false, pm = false;
    (segs || []).forEach(s => {
      const a = toMin(s[0]), b = toMin(s[1]); if (a == null || b == null || segMin(s) === 0) return;
      if (a < 13 * 60) am = true;
      if ((b >= a ? b : b + 1440) > 14 * 60) pm = true;
    });
    return am && pm;
  };

  /* ---------- réglages par défaut (contrat + bulletin) ---------- */
  const W = [['09:30', '12:30'], ['15:00', '19:00']];
  const defaults = () => ({
    prenom: '',
    employeur: 'Cosy Maison',
    contrat: { debut: '2026-10-01', fin: '2027-03-27', type: 'CDD' },
    tauxHoraire: 12.61,
    heuresMensuelles: 151.67,
    planning: [[], [], W, W, W, W, W], // dim, lun, mar … sam
    hs: { seuil25: 35, seuil50: 43, maj25: 25, maj50: 50, reposEnHS: true },
    majDimanche: 0, majFerie: 0, maj1erMai: 100,
    tickets: { actif: true, valeur: 7, partEmployeur: 60 },
    cotis: { vieillessePlaf: 6.90, vieillesseDeplaf: 0.40, t1: 4.01, t2: 9.72, cet: 0.14, csgDed: 6.80, csgNd: 2.40, crds: 0.50, abattement: 98.25, reducHS: 11.31 },
    pass: 4005,
    prevoyancePatronale: 83.20,
    mutuelleSalarie: 0,
    pas: 0,
    clotureJour: 0,
    deduireManquantes: false,
    cp: { mode: 'ouvrables', report: 7 },
    brutSaisonnier: 5476.33,
    finContrat: { precarite: true, inclureCP: true },
    theme: 'dark',
    github: { owner: '', repo: '', branch: 'main', path: 'centime-data.json', token: '', auto: false, last: null },
  });
  const newState = () => ({ v: 1, settings: defaults(), days: {}, months: {}, clock: null });

  /* ---------- journée ---------- */
  function dayInfo(S, k) {
    const st = S.settings;
    const inC = k >= st.contrat.debut && k <= st.contrat.fin;
    const hol = holidayName(k);
    const plan = inC ? (st.planning[dow(k)] || []) : [];
    const planMin = sumSeg(plan);
    const e = S.days[k];
    let type, segs = [], confirmed = false;
    if (e) { type = e.type; segs = type === 'travail' ? (e.seg || []) : []; confirmed = true; }
    else if (!inC) type = 'hors';
    else if (hol && planMin > 0) type = 'ferie';
    else if (planMin > 0) { type = 'travail'; segs = plan; }
    else type = 'repos';
    if (hol && planMin > 0 && type === 'repos') type = 'ferie';
    const worked = type === 'travail' ? sumSeg(segs) : 0;
    const paidAbs = (type === 'cp' || type === 'recup' || type === 'ferie') ? planMin : 0;
    const unpaid = (type === 'maladie' || type === 'absence') && !hol ? planMin : 0;
    let ticket = false;
    if (st.tickets.actif && type === 'travail') {
      const o = e && e.ticket;
      ticket = o === 'oui' ? true : o === 'non' ? false : ticketEligible(segs);
    }
    return { k, inC, hol, plan, planMin, type, segs, worked, paidAbs, unpaid, ticket, confirmed, note: e && e.note || '' };
  }

  /* ---------- rattachement au mois de paie ---------- */
  function payMonth(S, k) {
    const st = S.settings, c = +st.clotureJour || 0;
    let ym = c && +k.slice(8) > c ? addMonths(ymOf(k), 1) : ymOf(k);
    const a = ymOf(st.contrat.debut), b = ymOf(st.contrat.fin);
    if (ym < a) ym = a; if (ym > b) ym = b;
    return ym;
  }

  /* ---------- bulletin à partir des éléments variables ---------- */
  function payslip(st, I) {
    const c = st.cotis, L = [];
    const taux = st.tauxHoraire;
    const t25 = r4(taux * (1 + st.hs.maj25 / 100)), t50 = r4(taux * (1 + st.hs.maj50 / 100));
    const m25 = r2(I.h25 * t25), m50 = r2(I.h50 * t50), mNM = r2(I.hNM * taux);
    const mSun = r2(I.hSun * taux * st.majDimanche / 100), mFer = r2(I.hFer * taux * st.majFerie / 100), mMai = r2(I.hMai * taux * st.maj1erMai / 100);
    const primes = r2((I.primes || []).reduce((t, p) => t + (+p.montant || 0), 0));
    const extras = r2((I.extras || []).reduce((t, p) => t + (+p.montant || 0), 0));
    const brut = r2(I.base - I.absDed - I.defDed + m25 + m50 + mNM + mSun + mFer + mMai + primes + extras);
    const hsExo = r2(m25 + m50);
    const pass = st.pass, plaf = Math.min(brut, pass);
    const vPlaf = r2(plaf * c.vieillessePlaf / 100), vDeplaf = r2(brut * c.vieillesseDeplaf / 100), t1 = r2(plaf * c.t1 / 100);
    const t2 = brut > pass ? r2((Math.min(brut, 8 * pass) - pass) * c.t2 / 100) : 0;
    const cet = brut > pass ? r2(Math.min(brut, 8 * pass) * c.cet / 100) : 0;
    const mut = r2(+st.mutuelleSalarie || 0);
    const reducRate = Math.min(c.reducHS, c.vieillessePlaf + c.vieillesseDeplaf + c.t1);
    const reduc = r2(hsExo * reducRate / 100);
    const baseCSG = r2(r2((brut - hsExo) * c.abattement / 100) + (+st.prevoyancePatronale || 0));
    const baseCSGhs = r2(hsExo * c.abattement / 100);
    const csgDed = r2(baseCSG * c.csgDed / 100);
    const csgNd = r2(r2(baseCSG * c.csgNd / 100) + r2(baseCSG * c.crds / 100));
    const csgHsDed = r2(baseCSGhs * c.csgDed / 100);
    const csgHs = r2(csgHsDed + r2(baseCSGhs * c.csgNd / 100) + r2(baseCSGhs * c.crds / 100));
    const retenues = r2(vPlaf + vDeplaf + t1 + t2 + cet + mut - reduc + csgDed);
    const netSocial = r2(brut - retenues - csgNd - csgHs);
    const ticketSal = r2(st.tickets.valeur * (1 - st.tickets.partEmployeur / 100));
    const ticketPat = r2(st.tickets.valeur * st.tickets.partEmployeur / 100);
    const tickets = r2(I.tickets * ticketSal);
    const netAvantIR = r2(netSocial - tickets);
    const hsNetExo = r2(hsExo - csgHsDed);
    const imposable = r2(brut - retenues - csgHsDed - hsNetExo);
    const pas = r2(imposable * st.pas / 100);
    const net = r2(netAvantIR - pas);
    const evolution = r2(r2(brut * 3.15 / 100) - r2(baseCSG * 1.7 / 100));

    // lignes façon bulletin
    const add = (g, label, base, taux, montant, cls) => L.push({ g, label, base, taux, montant, cls });
    add('rem', 'Salaire de base', st.heuresMensuelles, taux, I.base);
    if (I.absDed) add('rem', 'Absence non rémunérée', I.hAbs, null, -I.absDed, 'neg');
    if (I.defDed) add('rem', 'Heures manquantes', I.hDef, null, -I.defDed, 'neg');
    if (I.h25) add('rem', 'Heures supplémentaires ' + st.hs.maj25 + ' %', I.h25, t25, m25, 'hs');
    if (I.h50) add('rem', 'Heures supplémentaires ' + st.hs.maj50 + ' %', I.h50, t50, m50, 'hs');
    if (I.hNM) add('rem', 'Heures en plus (non majorées)', I.hNM, taux, mNM);

    if (mFer) add('rem', 'Majoration jour férié ' + st.majFerie + ' %', I.hFer, null, mFer);
    if (mMai) add('rem', 'Majoration 1er mai ' + st.maj1erMai + ' %', I.hMai, null, mMai);
    (I.primes || []).forEach(p => { if (+p.montant) add('rem', p.label || 'Prime', null, null, r2(+p.montant)); });
    (I.extras || []).forEach(p => { if (+p.montant) add('rem', p.label, null, null, r2(+p.montant), 'extra'); });
    add('rem', 'SALAIRE BRUT', null, null, brut, 'total');

    add('csg', 'CSG/CRDS non déductible', baseCSG, r2(c.csgNd + c.crds), -csgNd);
    if (csgHs) add('csg', 'CSG/CRDS sur heures sup.', baseCSGhs, r2(c.csgDed + c.csgNd + c.crds), -csgHs);
    add('net', 'MONTANT NET SOCIAL', null, null, netSocial, 'sub');
    if (tickets) add('net', 'Tickets restaurant (part salariale)', I.tickets, ticketSal, -tickets);
    add('net', 'NET À PAYER AVANT IMPÔT', null, null, netAvantIR, 'sub');
    add('net', 'Impôt prélevé à la source', imposable, st.pas, -pas);
    add('net', 'NET À PAYER', null, null, net, 'grand');

    return { brut, retenues, netSocial, netAvantIR, imposable, pas, net, hsExo, hsNetExo, csgNd, csgHs, csgDed, baseCSG, baseCSGhs,
      tickets, ticketsPat: r2(I.tickets * ticketPat), nTickets: I.tickets, evolution, m25, m50, mNM, primes, extras, lines: L, inputs: I };
  }

  /* ---------- calcul complet ---------- */
  function compute(S, opts = {}) {
    const st = S.settings, today = opts.today || todayKey();
    const deb = st.contrat.debut, fin = st.contrat.fin;
    if (!deb || !fin || fin < deb) return null;
    const ymA = ymOf(deb), ymB = ymOf(fin);
    const start = mondayOf(deb), end = addDays(mondayOf(fin), 6);
    const days = {}, weeks = [], months = {};
    for (let ym = ymA; ym <= ymB; ym = addMonths(ym, 1)) {
      months[ym] = { ym, planFull: 0, planInC: 0, unpaid: 0, workedCal: 0, min25: 0, min50: 0, minNM: 0, minDef: 0, sun: 0, fer: 0, mai: 0, tickets: 0,
        unconfirmed: 0, futurePlanned: 0, weeks: [] };
    }
    // agrégats par mois civil (base, absences)
    for (let ym = ymA; ym <= ymB; ym = addMonths(ym, 1)) {
      const M = months[ym], n = daysInMonth(ym);
      for (let d = 1; d <= n; d++) {
        const k = ym + '-' + pad(d);
        const pm = sumSeg(st.planning[dow(k)] || []);
        if (!holidayName(k)) { M.planFull += pm; if (k >= deb && k <= fin) M.planInC += pm; }
      }
    }
    for (let k = start; k <= end; k = addDays(k, 1)) {
      const di = days[k] = dayInfo(S, k);
      if (!di.inC) continue;
      const ymc = ymOf(k), M = months[ymc];
      if (M) {
        M.unpaid += di.unpaid; M.workedCal += di.worked;
        if (!di.confirmed && di.planMin > 0 && !di.hol) { if (k <= today) M.unconfirmed++; else M.futurePlanned++; }
      }
      const P = months[payMonth(S, k)];
      if (P) {
        if (di.ticket) P.tickets++;
        if (di.worked) {
          if (dow(k) === 0) P.sun += di.worked;
          if (di.hol) { if (k.slice(5) === '05-01') P.mai += di.worked; else P.fer += di.worked; }
        }
      }
    }
    // semaines civiles (lundi → dimanche)
    for (let m = start; m <= end; m = addDays(m, 7)) {
      let eff = 0, paid = 0, unpaid = 0, P = 0, any = false, rest = 0;
      const list = [];
      for (let i = 0; i < 7; i++) {
        const di = days[addDays(m, i)]; list.push(di);
        if (di.inC) { any = true; P += di.planMin; if (di.planMin === 0 && di.worked) rest += di.worked; }
        eff += di.worked; paid += di.paidAbs; unpaid += di.unpaid;
      }
      if (!any) continue;
      const s25 = st.hs.seuil25 * 60, s50 = st.hs.seuil50 * 60;
      // jours de repos travaillés (lundi, dimanche…) : heures sup d'office si l'option est active
      const forced = st.hs.reposEnHS ? rest : 0;
      const totHS = forced ? forced + Math.max(0, eff - forced - s25) : Math.max(0, eff - s25);
      const min50 = Math.min(totHS, Math.max(0, eff - s50)), min25 = totHS - min50;
      const credited = eff + paid + unpaid;
      const minNM = Math.max(0, Math.max(0, credited - P) - min25 - min50);
      const minDef = Math.max(0, P - credited);
      const sunday = addDays(m, 6);
      const ym = payMonth(S, sunday);

      weeks.push(w);
      const M = months[ym];

    }

      const base = M.planFull && M.planInC !== M.planFull ? r2(full * M.planInC / M.planFull) : full;
      const absDed = M.unpaid && M.planFull ? r2(full * M.unpaid / M.planFull) : 0;
      const defDed = st.deduireManquantes && M.minDef && M.planFull ? r2(full * M.minDef / M.planFull) : 0;
      const mo = S.months[M.ym] || {};
      M.inputs = { base, absDed, hAbs: h(M.unpaid), defDed, hDef: h(M.minDef), h25: h(M.min25), h50: h(M.min50), hNM: h(M.minNM),
        hSun: h(M.sun), hFer: h(M.fer), hMai: h(M.mai), primes: mo.primes || [], tickets: M.tickets, extras: [] };
      M.pay = payslip(st, M.inputs);
    });
    const R = { days, weeks, months, full, today };
    R.cp = cpCalc(S, R, today);
    R.fin = finContrat(S, R);
    return R;
  }

  /* ---------- congés payés ---------- */
  function cpCalc(S, R, today) {
    const st = S.settings, deb = st.contrat.debut, fin = st.contrat.fin;
    const ouvres = st.cp.mode === 'ouvres';
    const rate = ouvres ? 25 / 12 : 2.5, rateMal = ouvres ? 2 * 5 / 6 : 2;
    const acquisJusqua = lim => {
      let tot = 0;
      for (let ym = ymOf(deb); ym <= ymOf(fin); ym = addMonths(ym, 1)) {
        const n = daysInMonth(ym), first = ym + '-01' < deb ? deb : ym + '-01';
        let last = ym + '-' + pad(n); if (last > fin) last = fin; if (last > lim) last = lim;
        if (last < first) continue;
        let a = rate * (dayDiff(first, last) + 1) / n;
        let jo = 0; for (let d = 1; d <= n; d++) { const k = ym + '-' + pad(d); if (dow(k) !== 0 && !holidayName(k)) jo++; }
        for (let k = first; k <= last; k = addDays(k, 1)) {
          const di = R.days[k] || dayInfo(S, k);
          if (di.type === 'absence' && di.planMin) a -= rate / jo;
          if (di.type === 'maladie' && di.planMin) a -= (rate - rateMal) / jo;
        }
        tot += Math.max(0, a);
      }
      return tot;
    };
    // décompte des jours pris
    const pris = [];
    for (let k = deb; k <= fin; k = addDays(k, 1)) {
      const di = R.days[k] || dayInfo(S, k);
      if (di.hol) continue;
      if (di.type === 'cp' && di.planMin > 0) { pris.push({ k, auto: false }); continue; }
      if (!ouvres && di.planMin === 0 && dow(k) !== 0) {
        // jour ouvrable non travaillé (ex. lundi) : compté si la dernière journée prévue avant lui est un congé
        for (let j = 1; j <= 6; j++) {
          const p = addDays(k, -j); if (p < deb) break;
          const dp = R.days[p] || dayInfo(S, p);
          if (dp.planMin > 0) { if (dp.type === 'cp') pris.push({ k, auto: true }); break; }
        }
      }
    }
    const report = +st.cp.report || 0;
    const lim = today < deb ? deb : today;
    const acquis = acquisJusqua(lim > fin ? fin : lim);
    const acquisFin = acquisJusqua(fin);
    const prisPasses = pris.filter(p => p.k <= today).length, posesFuturs = pris.length - prisPasses;
    const totalFin = report + Math.ceil(acquisFin - 1e-9);
    return { report, acquis, acquisFin, acquisFinArrondi: Math.ceil(acquisFin - 1e-9), pris, prisPasses, posesFuturs,
      solde: report + acquis - pris.length, soldePrisPasses: report + acquis - prisPasses, soldeFin: totalFin - pris.length, totalFin, unite: ouvres ? 'ouvrés' : 'ouvrables' };
  }

  /* ---------- fin de contrat (estimation) ---------- */
  function finContrat(S, R) {
    const st = S.settings, cp = R.cp;
    const brutContrat = r2(Object.values(R.months).reduce((t, M) => t + M.pay.brut, 0));
    const precarite = st.finContrat.precarite ? r2(brutContrat * 0.10) : 0;
    const solde = Math.max(0, cp.soldeFin);
    const dixieme = cp.totalFin ? r2((brutContrat + (+st.brutSaisonnier || 0)) * 0.10 * solde / cp.totalFin) : 0;
    const maintien = r2(solde * R.full / (st.cp.mode === 'ouvres' ? 21.67 : 26));
    const iccp = st.finContrat.inclureCP ? Math.max(dixieme, maintien) : 0;
    const ymFin = ymOf(st.contrat.fin), M = R.months[ymFin];
    let final = null;
    if (M) {
      const extras = [];
      if (iccp) extras.push({ label: 'Indemnité compensatrice de congés payés (' + solde + ' j)', montant: iccp });
      if (precarite) extras.push({ label: 'Indemnité de fin de contrat (10 %)', montant: precarite });
      final = payslip(st, Object.assign({}, M.inputs, { extras }));
    }
    return { brutContrat, precarite, solde, dixieme, maintien, iccp, final, ymFin,
      joursRestants: Math.max(0, dayDiff(R.today, st.contrat.fin)) };
  }

  /* ---------- auto-contrôle sur le bulletin de septembre 2026 ---------- */

const nf = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf4 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const nfx = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const n2 = x => nf.format(x);
const eur = x => nf.format(x) + ' €';
const nd = x => nfx.format(x);
const hm = m => { const neg = m < 0; m = Math.abs(Math.round(m)); return (neg ? '−' : '') + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
const hShort = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return r ? h + 'h' + String(r).padStart(2, '0') : h + 'h'; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ymLabel = ym => cap(MOIS[+ym.slice(5) - 1]) + ' ' + ym.slice(0, 4);
const ymShort = ym => cap(MOISC[+ym.slice(5) - 1]) + ' ' + ym.slice(2, 4);
const ymMonth = ym => MOIS[+ym.slice(5) - 1];
const dLong = k => { const d = E.fromKey(k); return JOURS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()]; };
const dShort = k => { const d = E.fromKey(k); return JC[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MOISC[d.getUTCMonth()]; };
const dDate = k => { const d = E.fromKey(k); return d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const fmtT = t => t.replace(/^0(\d)/, '$1').replace(':', 'h');
const segTxt = segs => (segs || []).filter(s => s[0] && s[1]).map(s => fmtT(s[0]) + '–' + fmtT(s[1])).join(' · ');
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => E.todayKey();
const numIn = v => String(v).replace('.', ',');
const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };

/* ---------- état ---------- */
function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def;
  if (def && typeof def === 'object') {
    const o = {};
    for (const k in def) o[k] = val && typeof val === 'object' && k in val ? merge(def[k], val[k]) : def[k];
    if (val && typeof val === 'object') for (const k in val) if (!(k in o)) o[k] = val[k];
    return o;
  }
  return val === undefined || val === null ? def : val;
}
function hydrate(j) {
  const s = E.newState();
  s.settings = merge(s.settings, j.settings || {});
  s.days = j.days || {}; s.months = j.months || {}; s.clock = j.clock || null; s.onboarded = !!j.onboarded;
  return s;
}
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.v) return hydrate(j); } catch (e) { }
  return E.newState();
}
let S = load();
let R = null;
const ui = { tab: 'home', calYm: null, payYm: null, sheet: null, anim: true, showFinal: true };
const sync = { state: '', timer: null, busy: false };

function save(doSync = true) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Stockage du téléphone plein'); }
  if (doSync) scheduleSync();
}
function recompute() { R = E.compute(S); }
function commit(msg) { save(); recompute(); render(); if (msg) toast(msg); }
const contractYm = ym => { const a = E.ymOf(S.settings.contrat.debut), b = E.ymOf(S.settings.contrat.fin); return ym < a ? a : ym > b ? b : ym; };
const dayOf = k => (R && R.days[k]) || E.dayInfo(S, k);

/* ---------- rendu ---------- */
let rendering = false, renderAgain = false;
function render() {
  // un champ qui perd le focus pendant le rendu déclenche « change » → rendu imbriqué : on le reporte
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; setTimeout(render, 0); }
}
function renderNow() {
  applyTheme();
  const v = document.getElementById('view');
  let html;
  if (!R) html = vBroken();
  else html = ({ home: vHome, hours: vHours, pay: vPay, cp: vCP, settings: vSettings })[ui.tab]();
  v.innerHTML = '<div class="' + (ui.anim ? 'screen' : '') + '">' + html + '</div>';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === ui.tab));
  if (ui.anim) animateCounts();
  ui.anim = false;
}
function vBroken() {
  return head('Réglages', 'Contrat à vérifier') + '<div class="card"><p class="help">Les dates de début et de fin du contrat ne sont pas valides. Corrige-les dans Réglages → Contrat.</p></div>' + vSettings(true);
}
function head(sub, title) {
  return `<div class="top"><div><small>${sub}</small><h1>${title}</h1></div><div class="act">${cloudBtn()}</div></div>`;
}
function cloudBtn() {
  const g = S.settings.github;
  if (!g.token || !g.repo || !g.owner) return '';
  return `<button class="icbtn ${sync.state}" id="cloud" data-a="ghSave" aria-label="Sauvegarder sur GitHub">${IC.cloud}</button>`;
}
function animateCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, span = el.querySelector('span'), sfx = span ? span.outerHTML : '';
    const t0 = performance.now(), d = 650;
    const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); el.innerHTML = n2(to * e) + sfx; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function verifBadge() {
  const t = E.selfTest(S.settings);
  return t.ok ? `<span class="badge g">${IC.check.replace('<svg', '<svg width="12" height="12"')} Calé sur ton bulletin</span>` : `<span class="badge r">Contrôle moteur en échec</span>`;
}
function ring(eff, target) {
  const r = 34, c = 2 * Math.PI * r, f = Math.min(1, target ? eff / target : 0), over = target ? Math.max(0, (eff - target) / target) : 0;
  return `<svg class="ring" viewBox="0 0 84 84"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold2)"/></linearGradient></defs>
  <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/>
  <circle cx="42" cy="42" r="${r}" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
  ${over > 0 ? `<circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--green)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * Math.min(1, over)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>` : ''}
  <text x="42" y="47" text-anchor="middle" font-size="15" font-weight="800" fill="var(--tx)" font-family="-apple-system,system-ui">${Math.round((target ? eff / target : 0) * 100)}%</text></svg>`;
}

/* ---------- ACCUEIL ---------- */
function vHome() {
  const t = today(), st = S.settings;
  const ym = contractYm(E.ymOf(t)), M = R.months[ym], P = M.pay;
  const hr = new Date().getHours();
  let h = head(cap(dLong(t)) + ' · semaine ' + E.isoWeek(t), (hr < 5 || hr >= 18 ? 'Bonsoir' : 'Bonjour') + (st.prenom ? ' ' + esc(st.prenom) : ''));

    <div class="lbl">Net à payer estimé · ${ymLabel(ym)}</div>

    <div class="sub"><span>Brut <b class="num">${eur(P.brut)}</b></span><span>Heures sup <b class="num">${hm(M.min25 + M.min50)}</b></span><span>Tickets <b>${M.tickets}</b></span></div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${verifBadge()}${M.unconfirmed ? `<span class="badge o">${M.unconfirmed} j à confirmer</span>` : ''}</div>
  </div>`;

  if (totUnc) h += `<button class="alert" data-a="goHours"><div><b>${totUnc} journée${totUnc > 1 ? 's' : ''} passée${totUnc > 1 ? 's' : ''}</b> encore « prévue${totUnc > 1 ? 's' : ''} » : confirme ou corrige tes vraies heures.</div><span class="go">Voir ›</span></button>`;

  // aujourd'hui
  const di = dayOf(t);
  let st1, acts = '';
  if (S.clock) {
    st1 = `Arrivée pointée à <b>${fmtT(S.clock.start)}</b>${S.clock.k !== t ? ' le ' + dShort(S.clock.k) : ''}`;
    acts = `<div class="live num" id="live">${hm(elapsed())}</div><div class="btns" style="margin-top:12px"><button class="btn pri" data-a="clockOut">${IC.stop} Pointer le départ</button><button class="btn sm ghost dang" data-a="clockCancel">Annuler</button></div>`;
  } else if (!di.inC) {
    st1 = t < st.contrat.debut ? 'Ton contrat commence le ' + dDate(st.contrat.debut) : 'Contrat terminé le ' + dDate(st.contrat.fin);
  } else {
    if (di.type === 'travail') st1 = (di.confirmed ? 'Saisi · ' : 'Prévu · ') + (segTxt(di.segs) || 'aucune plage') + ' · <b>' + hm(di.worked) + '</b>';
    else st1 = TYPES[di.type] + (di.hol ? ' · ' + di.hol : '');
    acts = '<div class="btns">';
    if (di.type === 'travail' && !di.confirmed) acts += `<button class="btn pri" data-a="confirmDay" data-k="${t}">${IC.check} Conforme</button>`;
    acts += `<button class="btn" data-a="day" data-k="${t}">${IC.edit} ${di.confirmed ? 'Modifier' : 'Corriger'}</button>`;
    acts += `<button class="btn" data-a="clockIn">${IC.play} Pointer</button></div>`;
  }
  h += `<div class="card today"><h3>Aujourd'hui${di.confirmed ? '<span class="badge g">✓ saisi</span>' : ''}</h3><div class="when">${dLong(t)}</div><div class="st">${st1}</div>${acts}</div>`;

  // semaine
  const w = R.weeks.find(x => x.monday === E.mondayOf(t));
  if (w) {
    const tgt = Math.min(w.P, st.hs.seuil25 * 60) || st.hs.seuil25 * 60;
    const hs = w.min25 + w.min50;
    h += `<div class="card"><h3>Semaine ${w.num}<span class="r">${dShort(w.monday)} → ${dShort(w.sunday)}</span></h3>
      <div class="wk">${ring(w.eff, tgt)}<div class="info"><div class="hh num">${hm(w.eff)} <small class="muted" style="font-size:15px">/ ${hm(tgt)}</small></div>
      <div class="tiny" style="margin-top:4px">${hs ? `<span class="badge g">+${hm(hs)} heures sup</span>` : w.eff >= tgt ? 'Objectif atteint' : 'Encore ' + hm(tgt - w.eff) + ' prévues'}</div>
      <div class="tiny" style="margin-top:6px">Heures sup payées sur le bulletin de ${ymMonth(w.ym)}</div></div></div></div>`;
  }

  // tuiles
  const C = R.cp, F = R.fin;
  h += `<div class="grid2">
    <div class="card stat"><div class="k"><span class="dot" style="background:var(--green)"></span>Heures sup</div><div class="v num">${hm(M.min25 + M.min50)}</div><div class="d">${eur(P.m25 + P.m50)} sur le bulletin de ${ymMonth(ym)}${hsNext(ym, t)}</div></div>
    <button class="card stat" style="text-align:left" data-a="tab" data-t="cp"><div class="k"><span class="dot" style="background:var(--blue)"></span>Congés</div><div class="v num">${nd(C.solde)} <small>j</small></div><div class="d">solde · jours ${C.unite}</div></button>
    <div class="card stat"><div class="k"><span class="dot"></span>Tickets resto</div><div class="v num">${M.tickets}</div><div class="d">${eur(P.tickets)} retenus · ${eur(P.ticketsPat)} offerts</div></div>
    <div class="card stat"><div class="k"><span class="dot" style="background:var(--purple)"></span>Fin de contrat</div><div class="v num">J-${F.joursRestants}</div><div class="d">${dDate(st.contrat.fin)}</div></div>
  </div>`;
  const next = nextHoliday(t);
  if (next) h += `<div class="card"><div class="row"><span class="l">Prochain jour férié</span><span class="v">${next.name} · ${dShort(next.k)}</span></div></div>`;

}
function hsNext(ym, t) {

function nextHoliday(t) {

function elapsed() {

}

/* ---------- HEURES ---------- */
function vHours() {
  const ym = ui.calYm || E.ymOf(today());

  const t = today(), wNow = E.isoWeek(t);

  const mon0 = E.mondayOf(t);
  let unc = 0;
  for (let m = E.mondayOf(first); m <= last; m = E.addDays(m, 7)) {
    cal += `<div class="wkn${m === mon0 ? ' now' : ''}">S${E.isoWeek(m)}</div>`;
    for (let i = 0; i < 7; i++) {
      const k = E.addDays(m, i);
      if (k < first || k > last) { cal += '<div></div>'; continue; }
      const d = +k.slice(8), di = dayOf(k);
      let cls = 'cd', tx = '';
      switch (di.type) {
        case 'travail': cls += di.confirmed ? ' w' : ' plan'; if (!di.planMin && di.worked && S.settings.hs.reposEnHS) cls += ' hsday'; tx = hShort(di.worked); if (!di.confirmed && k <= t) unc++; break;
        case 'cp': cls += ' cp'; tx = 'CP'; break;
        case 'ferie': cls += ' ferie'; tx = 'Férié'; break;
        case 'maladie': cls += ' maladie'; tx = 'Mal.'; break;
        case 'absence': cls += ' absence'; tx = 'Abs.'; break;
        case 'recup': cls += ' recup'; tx = 'Récup'; break;
        case 'repos': cls += ' repos'; tx = di.hol ? '★' : ''; break;
        default: cls += ' hors';
      }

    }
  }
  h += `<div class="card"><div class="mnav"><button class="icbtn" data-a="calPrev">${IC.left}</button><b>${ymLabel(ym)}</b><button class="icbtn" data-a="calNext">${IC.right}</button></div>

    ${unc ? `<div class="btns" style="margin-top:14px"><button class="btn pri" data-a="confirmMonth" data-ym="${ym}">${IC.check} Confirmer ${unc} jour${unc > 1 ? 's' : ''} passé${unc > 1 ? 's' : ''}</button></div>` : ''}
  </div>`;

  const M = R.months[ym];
  if (M) {
    let jt = 0;
    for (let d = 1; d <= n; d++) { const di = dayOf(ym + '-' + String(d).padStart(2, '0')); if (di.inC && di.type === 'travail' && di.worked) jt++; }
    h += `<div class="grid2">
      <div class="card stat"><div class="k">Heures du mois</div><div class="v num">${hm(M.workedCal)}</div><div class="d">${jt} jour${jt > 1 ? 's' : ''} travaillé${jt > 1 ? 's' : ''}</div></div>
      <div class="card stat"><div class="k">Heures sup payées</div><div class="v num pos">${hm(M.min25 + M.min50)}</div><div class="d">sur le bulletin de ${ymMonth(ym)}</div></div></div>`;
  }
  const ws = R.weeks.filter(w => w.monday <= last && w.sunday >= first);
  if (ws.length) {
    h += '<div class="card"><h3>Semaines<span class="r">seuil ' + S.settings.hs.seuil25 + ' h</span></h3>';
    ws.forEach(w => {
      const tags = [];
      if (w.min25) tags.push(`<span class="badge g">+${hm(w.min25)} à ${S.settings.hs.maj25} %</span>`);
      if (w.min50) tags.push(`<span class="badge g">+${hm(w.min50)} à ${S.settings.hs.maj50} %</span>`);

      if (w.minNM) tags.push(`<span class="badge">+${hm(w.minNM)} normales</span>`);
      if (w.minDef) tags.push(`<span class="badge o">−${hm(w.minDef)} manquantes</span>`);
      if (w.paid) tags.push(`<span class="badge b">${hm(w.paid)} payées non travaillées</span>`);
      h += `<div class="week"><div class="wtop"><div><div class="wn">Semaine ${w.num}${w.monday === E.mondayOf(t) ? ' <span class="badge">en cours</span>' : ''}</div><div class="wr">${dShort(w.monday)} → ${dShort(w.sunday)}${w.ym !== ym ? ' · payée en ' + ymMonth(w.ym) : ''}</div></div>

    <p>Les congés et jours fériés ne comptent pas comme travail effectif pour le seuil. Si tu fais des heures en plus une semaine avec un férié, elles sont payées au taux normal tant que tu ne dépasses pas ${S.settings.hs.seuil25} h effectives.</p>

  return h;
}

/* ---------- PAIE ---------- */

  else if (M.futurePlanned) status = `<span class="badge">Prévisionnel · ${M.futurePlanned} j à venir</span>`;
  else status = `<span class="badge g">✓ Mois entièrement saisi</span>`;
  h += `<div class="card hero"><div class="lbl">Net à payer · ${ymLabel(ym)}${isFinal && ui.showFinal ? ' · solde de tout compte' : ''}</div>

    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${status}</div></div>`;
  if (isFinal) h += `<div class="card"><div class="fld" style="padding:0"><label>Inclure le solde de tout compte<small>Congés non pris + indemnité de fin de contrat (estimation)</small></label><label class="sw"><input type="checkbox" id="showFinal" ${ui.showFinal ? 'checked' : ''}><span></span></label></div></div>`;

  // répartition
  const cot = r2(P.retenues - P.csgDed), csg = r2(P.csgDed + P.csgNd + P.csgHs);
  const parts = [[P.net, 'var(--gold)', 'Net'], [cot, 'var(--blue)', 'Retraite'], [csg, 'var(--purple)', 'CSG/CRDS'], [P.tickets, 'var(--orange)', 'Tickets'], [P.pas, 'var(--red)', 'Impôt']].filter(p => p[0] > 0);
  h += `<div class="card"><h3>Où va ton brut</h3><div style="display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px">${parts.map(p => `<i style="flex:${p[0]};background:${p[1]}"></i>`).join('')}</div>
    <div class="legend">${parts.map(p => `<span><i style="background:${p[1]}"></i>${p[2]} ${eur(p[0])} · ${Math.round(p[0] / P.brut * 100)} %</span>`).join('')}</div></div>`;

  h += `<div class="card bul"><h3>Bulletin<span class="r">${ymLabel(ym)}</span></h3>${bulletin(P)}</div>`;
  h += `<div class="card"><h3>Infos du bulletin</h3><div class="rows">
    <div class="row"><span class="l">Net imposable</span><span class="v num">${eur(P.imposable)}</span></div>

    <div class="row"><span class="l">dont suppression cotis. chômage et maladie</span><span class="v num">${eur(P.evolution)}</span></div>
    <div class="row"><span class="l">Heures sup du mois</span><span class="v num">${hm(M.min25 + M.min50)}</span></div></div></div>`;

  // primes
  const mo = S.months[ym] || {};
  const primes = mo.primes || [];
  h += `<div class="card"><h3>Primes du mois</h3><div class="rows">${primes.map((p, i) => `<div class="row"><span class="l"><b>${esc(p.label || 'Prime')}</b></span><span class="v num">${eur(+p.montant || 0)} <button class="btn sm ghost dang" data-a="delPrime" data-ym="${ym}" data-i="${i}" aria-label="Supprimer">${IC.x}</button></span></div>`).join('') || '<div class="empty">Aucune prime ce mois-ci</div>'}</div>
    <div style="display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px"><input class="inp" id="pLabel" placeholder="Libellé (ex. Prime A)"><input class="inp num" id="pAmount" inputmode="decimal" placeholder="Montant"><button class="btn sm pri" data-a="addPrime" data-ym="${ym}">${IC.plus}</button></div>
    <p class="tiny" style="margin-top:8px">Montant brut, soumis à cotisations comme sur ton bulletin.</p></div>`;

  // comparaison
  const reel = mo.netReel;
  let ecart = '';
  if (reel != null && reel !== '') {
    const d = r2(+reel - P.net);
    ecart = Math.abs(d) < 0.005 ? '<span class="badge g">✓ Identique au centime</span>' : `<span class="badge ${d > 0 ? 'g' : 'r'}">Écart ${d > 0 ? '+' : ''}${eur(d)}</span>`;
  }
  h += `<div class="card"><h3>Comparer avec ton vrai bulletin</h3><div class="fld" style="padding-top:0"><label>Net à payer reçu</label><input type="text" inputmode="decimal" data-mset="${ym}.netReel" value="${reel != null ? numIn(reel) : ''}" placeholder="0,00"></div>${ecart ? '<div style="margin-top:6px">' + ecart + '</div>' : ''}</div>`;

  // contrôle
  const T = E.selfTest(S.settings);
  h += `<div class="card"><div class="ver ${T.ok ? '' : 'ko'}"><div class="ic">${T.ok ? '✓' : '!'}</div><div><b>${T.ok ? 'Moteur contrôlé sur ton bulletin de septembre 2026' : 'Écart avec le bulletin de référence'}</b><div class="tiny">${T.checks.filter(c => c.ok).length}/${T.checks.length} montants identiques au centime</div></div></div>
    <details><summary>Voir le détail</summary><div class="chk"><b>Ligne</b><b>Bulletin</b><b>Centime</b>${T.checks.map(c => `<span>${labelCheck(c.key)}</span><span>${n2(c.attendu)}</span><span class="${c.ok ? 'pos' : 'neg'}">${n2(c.calcule)}</span>`).join('')}</div></details></div>`;

  // cumuls
  const cur = contractYm(E.ymOf(today()));
  const past = Object.values(R.months).filter(m => m.ym <= cur);
  const sum = f => r2(past.reduce((a, m) => a + f(m), 0));
  h += `<div class="card"><h3>Cumuls du contrat<span class="r">jusqu'à ${ymMonth(cur)}</span></h3><div class="rows">
    <div class="row"><span class="l">Brut cumulé</span><span class="v num">${eur(sum(m => m.pay.brut))}</span></div>
    <div class="row"><span class="l">Net cumulé</span><span class="v num">${eur(sum(m => m.pay.net))}</span></div>
    <div class="row"><span class="l">Heures sup</span><span class="v num">${hm(past.reduce((a, m) => a + m.min25 + m.min50, 0))} · ${eur(sum(m => m.pay.m25 + m.pay.m50))}</span></div>
    <div class="row"><span class="l">Brut total prévu sur le contrat</span><span class="v num">${eur(R.fin.brutContrat)}</span></div></div></div>`;
  return h;
}
function labelCheck(k) {
  return ({ brut: 'Salaire brut', retenues: 'Total retenues', netSocial: 'Net social', netAvantIR: 'Net avant impôt', imposable: 'Net imposable', hsNetExo: 'HS nettes exo.', csgNd: 'CSG/CRDS non déd.', csgHs: 'CSG/CRDS HS', csgDed: 'CSG déductible', tickets: 'Tickets resto', evolution: 'Suppr. cotis.', net: 'Net à payer' })[k] || k;
}
const r2 = E.r2;
function bulletin(P) {
  const G = { rem: 'Rémunération', cot: 'Cotisations salariales', csg: 'CSG / CRDS', net: 'Net' };
  let h = '', g = '';
  P.lines.forEach(l => {
    if (l.g !== g) { g = l.g; h += `<div class="grp">${G[g]}</div>`; }
    let d = '';
    if (l.cls === 'total' || l.cls === 'sub' || l.cls === 'grand') d = '';
    else if (l.g === 'rem' && l.base != null && l.taux != null) d = `${n2(l.base)} h × ${nf4.format(l.taux)} €`;
    else if (l.g === 'rem' && l.base != null) d = `${n2(l.base)} h`;
    else if (l.label.startsWith('Tickets')) d = `${l.base} × ${n2(l.taux)} €`;
    else if (l.base != null && l.taux != null) d = `${n2(l.base)} € × ${nf4.format(Math.abs(l.taux))} %`;
    const m = l.montant;
    h += `<div class="bl ${l.cls || ''}"><div><div class="bn">${esc(l.label)}</div>${d ? `<div class="bd num">${d}</div>` : ''}</div><div class="bm num">${l.cls === 'total' || l.cls === 'sub' || l.cls === 'grand' ? eur(Math.abs(m)) : (m < 0 ? '−' : '') + eur(Math.abs(m))}</div></div>`;
  });
  return h;
}

function addMin(t, m) { let x = (E.toMin(t) + m) % 1440; if (x < 0) x += 1440; return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); }

/* ---------- GitHub ---------- */
const ghCfg = () => { const g = S.settings.github; return g.token && g.owner && g.repo ? g : null; };
const ghUrl = g => `https://api.github.com/repos/${encodeURIComponent(g.owner.trim())}/${encodeURIComponent(g.repo.trim())}/contents/${(g.path || 'centime-data.json').trim().split('/').map(encodeURIComponent).join('/')}`;
function ghFetch(g, method, body) {
  const url = ghUrl(g) + (method === 'GET' ? '?ref=' + encodeURIComponent(g.branch || 'main') + '&t=' + Date.now() : '');
  const headers = { Authorization: 'Bearer ' + g.token.trim(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (body) headers['Content-Type'] = 'application/json';
  return fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
}
const ghErr = s => s === 401 ? 'jeton invalide ou expiré' : s === 403 ? 'le jeton n\'a pas le droit d\'écrire (Contents : Read and write)' : s === 404 ? 'dépôt ou branche introuvable' : s === 409 || s === 422 ? 'conflit, réessaie' : 'erreur ' + s;
function exportData() { const d = clone(S); d.settings.github = Object.assign({}, d.settings.github, { token: '', lastErr: '' }); d.app = 'centime'; d.exportedAt = new Date().toISOString(); return d; }
const b64e = str => { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

function setSync(state) { sync.state = state; const c = document.getElementById('cloud'); if (c) c.className = 'icbtn ' + state; }

async function ghSave(manual) {

    if (sha) body.sha = sha;
    const r = await ghFetch(g, 'PUT', body);
    if (!r.ok) throw new Error(ghErr(r.status));

    save(false); setSync('ok'); if (manual) toast('Sauvegardé sur GitHub ✓');
  } catch (e) {

  if (el.dataset.slot != null && ui.sheet && ui.sheet.kind === 'day') { ui.sheet.draft.seg[+el.dataset.slot][+el.dataset.p] = el.value; refreshDayTotals(); }
  else if (el.id === 'dNote' && ui.sheet && ui.sheet.draft) ui.sheet.draft.note = el.value;
});
// glisser pour fermer la feuille
(() => {
  const s = document.getElementById('sheet'); let y0 = null, dy = 0;
  s.addEventListener('touchstart', e => { if (s.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; s.style.transition = 'none'; } }, { passive: true });
  s.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) s.style.transform = `translateY(${dy}px)`; }, { passive: true });
  s.addEventListener('touchend', () => { if (y0 == null) return; s.style.transition = ''; if (dy > 110) closeSheet(); else s.style.transform = ''; y0 = null; });
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { recompute(); if (!ui.sheet) render(); } });
setInterval(() => { if (S.clock && ui.tab === 'home') { const l = document.getElementById('live'); if (l) l.textContent = hm(elapsed()); } }, 15000);

/* ---------- démarrage ---------- */
recompute();
render();
splash();
function splash() {
  const el = document.getElementById('splash');
  if (!el) { if (!S.onboarded) setTimeout(welcome, 350); return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 450 : 2250;
  try {
    const ym = contractYm(E.ymOf(today())), net = R.months[ym].pay.net;
    document.getElementById('spLbl').textContent = 'Net estimé · ' + ymMonth(ym);
    const n = document.getElementById('spNet'), s0 = performance.now() + (reduce ? 0 : 1000), d = reduce ? 1 : 1000;
    const step = now => { const p = Math.max(0, Math.min(1, (now - s0) / d)), e = 1 - Math.pow(1 - p, 4); n.textContent = n2(net * e) + '\u00a0€'; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  } catch (e) { }
  let gone = false;
  const done = () => {
    if (gone) return; gone = true;
    el.classList.add('out');
    ui.anim = true; render();
    setTimeout(() => { el.remove(); if (!S.onboarded) welcome(); }, 560);
  };
  setTimeout(done, dur);
  el.addEventListener('click', done);
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
